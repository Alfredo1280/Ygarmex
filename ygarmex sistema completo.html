<title>YGARMEX — Sistema Completo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#F0F2F7;color:#1A2744;font-size:14px;padding-bottom:80px;}
:root{--navy:#1B2A4A;--orange:#F5820D;--green:#2ECC8F;--red:#C1442D;--yellow:#D98E2B;--bg:#F0F2F7;--card:#fff;--muted:#6B7A99;--border:#DDE3F0;}

#header{background:var(--navy);position:sticky;top:0;z-index:100;padding:0 14px;}
#header-top{display:flex;align-items:center;justify-content:space-between;padding:10px 0 6px;}
#logo{display:flex;align-items:center;gap:10px;}
#logo-icon{background:var(--orange);border-radius:9px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:16px;}
#logo-text{color:#fff;font-weight:800;font-size:14px;}
#logo-sub{color:#8899BB;font-size:9px;}
#nav-icons{display:flex;gap:2px;}
.nav-btn{background:none;border:none;cursor:pointer;padding:6px 8px;border-radius:8px;font-size:16px;position:relative;color:#8899BB;}
.nav-btn.active{background:rgba(245,130,13,.2);color:var(--orange);}
#alert-badge{position:absolute;top:4px;right:4px;background:var(--red);color:#fff;border-radius:99px;width:13px;height:13px;font-size:8px;font-weight:800;display:flex;align-items:center;justify-content:center;}
#nav-labels{display:flex;}
.nav-label{flex:1;text-align:center;font-size:9px;font-weight:700;color:#8899BB;padding:4px 0 8px;cursor:pointer;border-bottom:2px solid transparent;}
.nav-label.active{color:var(--orange);border-bottom-color:var(--orange);}

#content{padding:14px 12px;max-width:960px;margin:0 auto;}

.card{background:var(--card);border-radius:12px;padding:16px;box-shadow:0 1px 4px rgba(26,39,68,.08);margin-bottom:12px;}
.card h4{font-size:13px;color:var(--navy);margin-bottom:10px;}

.kpi-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.kpi{background:var(--card);border-radius:12px;padding:13px;flex:1;min-width:110px;box-shadow:0 1px 4px rgba(26,39,68,.08);}
.kpi-icon{font-size:18px;margin-bottom:2px;}
.kpi-val{font-size:20px;font-weight:800;line-height:1.1;}
.kpi-label{font-size:10px;color:var(--muted);margin-top:3px;}

.hist-row{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff;}
.hist-row-dim{background:#F7F5F0;opacity:0.85;}
.hist-row-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;}
.hist-qty{font-weight:800;font-size:15px;color:#4F7858;}
.hist-qty.salida{color:#C1442D;}
.hist-fecha{font-size:12px;color:#6B7A99;}
.hist-prov{font-size:13px;font-weight:600;margin-bottom:2px;}
.hist-notas{font-size:12px;color:#6B7A99;line-height:1.4;}
.hist-tag{display:flex;align-items:center;gap:4px;font-size:11px;color:#D98E2B;margin-top:4px;font-weight:600;}

.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;}

.btn{border:none;border-radius:8px;cursor:pointer;font-weight:700;font-family:inherit;font-size:13px;padding:8px 16px;}
.btn-primary{background:var(--orange);color:#fff;}
.btn-ghost{background:transparent;color:var(--navy);border:1.5px solid var(--border);}
.btn-success{background:#E8FAF3;color:#1a7a56;border:1.5px solid rgba(46,204,143,.4);}
.btn-danger{background:#FFF5F5;color:var(--red);border:1.5px solid rgba(193,68,45,.25);}
.btn-warn{background:#FFF8E1;color:#D98E2B;border:1.5px solid rgba(217,142,43,.35);}
.btn-sm{padding:5px 10px;font-size:11px;}
.btn-full{width:100%;margin-top:6px;}

.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th{padding:7px 10px;text-align:left;color:var(--muted);font-size:11px;font-weight:700;border-bottom:2px solid var(--border);white-space:nowrap;}
td{padding:8px 10px;color:var(--navy);border-bottom:1px solid var(--border);}
tr:nth-child(even) td{background:#FAFBFD;}

.tab-bar{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
.tab-btn{padding:6px 13px;border-radius:8px;border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:12px;background:var(--border);color:var(--muted);}
.tab-btn.active{background:var(--navy);color:#fff;}

.silo-wrap{width:32px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;}
.silo-cap{width:36px;height:6px;background:#D8D2C2;border-radius:4px 4px 0 0;margin-bottom:-1px;}
.silo-body{width:32px;height:60px;background:#EFEAE0;border-radius:0 0 8px 8px;overflow:hidden;display:flex;align-items:flex-end;border:1px solid #DDD6C7;}
.silo-fill{width:100%;transition:height .3s ease;}

.alert-strip{background:#2A1B05;color:#FCE8C8;margin-bottom:12px;border-radius:12px;padding:10px 14px;border:1px solid #D98E2B55;}
.alert-strip-head{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin-bottom:8px;}
.alert-item-row{display:flex;justify-content:space-between;padding:5px 0;font-size:12px;border-bottom:1px solid #D98E2B33;}

#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:999;align-items:flex-end;justify-content:center;}
#modal-overlay.open{display:flex;}
#modal-box{background:#fff;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:20px 16px 30px;max-height:88vh;overflow-y:auto;}
#modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
#modal-title{font-size:15px;font-weight:700;color:var(--navy);}
#modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted);}
.form-group{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;}
.form-label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.3px;}
.form-input,.form-select{border:1.5px solid var(--border);border-radius:8px;padding:9px 10px;font-size:14px;color:var(--navy);outline:none;font-family:inherit;background:#fff;width:100%;}
.form-input:focus,.form-select:focus{border-color:var(--orange);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}

.prod-linea{background:#F7F5F0;border-radius:10px;padding:12px;margin-bottom:8px;border:1px solid var(--border);}
.prod-linea-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.prod-linea-num{font-size:11px;font-weight:700;color:var(--orange);background:#FFF3E0;padding:2px 8px;border-radius:99px;}
.consumo-preview{background:#E8FAF3;border-radius:8px;padding:10px;margin-top:10px;font-size:12px;}
.consumo-row{display:flex;justify-content:space-between;padding:2px 0;color:#1a7a56;}

.bar-wrap{background:var(--border);border-radius:99px;height:5px;margin-top:3px;}
.bar-fill{height:5px;background:var(--orange);border-radius:99px;}

/* LOGIN */
#login-screen{position:fixed;inset:0;background:#1B2A4A;z-index:9999;display:flex;align-items:center;justify-content:center;}
#login-box{background:#fff;border-radius:16px;padding:32px 28px;width:90%;max-width:360px;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.3);}
#login-logo{background:#F5820D;border-radius:12px;width:56px;height:56px;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 16px;}
#login-title{font-size:20px;font-weight:800;color:#1B2A4A;margin-bottom:4px;}
#login-sub{font-size:12px;color:#6B7A99;margin-bottom:20px;}

/* PIN */
#pin-dots{display:flex;gap:14px;justify-content:center;margin-bottom:16px;}
.pin-dot{width:16px;height:16px;border-radius:50%;background:#DDE3F0;border:2px solid #8899BB;transition:background .2s;}
.pin-dot.lleno{background:#F5820D;border-color:#F5820D;}
#pin-teclado{display:grid;grid-template-columns:repeat(3,64px);gap:10px;justify-content:center;}
.pin-tecla{height:64px;border-radius:50%;border:2px solid #DDE3F0;background:#F0F2F7;color:#1B2A4A;font-size:1.4rem;font-weight:700;cursor:pointer;transition:background .15s;}
.pin-tecla:active{background:#DDE3F0;}
#pin-error{color:#C1442D;font-size:13px;margin-top:8px;min-height:20px;}

/* TOAST */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1A2744;color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:9000;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;}
#toast.show{opacity:1;}

#footer{text-align:center;padding:10px 0 16px;color:var(--muted);font-size:10px;}

/* MOV corrección */
.mov-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px;}
.mov-item:last-child{border-bottom:none;}
.mov-tipo{font-weight:700;}
.mov-entrada{color:#2ECC8F;}
.mov-salida{color:#C1442D;}
.mov-produccion{color:#D98E2B;}
</style>
</head>

const PIN = '1280';
let pinActual = '';

function pinTecla(n) {
  if (pinActual.length >= 4) return;
  pinActual += n;
  actualizarPinDots();
  if (pinActual.length === 4) verificarPin();
}
function pinBorrar() {
  pinActual = pinActual.slice(0,-1);
  actualizarPinDots();
  document.getElementById('pin-error').textContent = '';
}
function actualizarPinDots() {
  for (let i=0;i<4;i++) document.getElementById('pd'+i).classList.toggle('lleno', i < pinActual.length);
}
function verificarPin() {
  if (pinActual === PIN) {
    document.getElementById('login-screen').style.display = 'none';
    iniciarApp();
  } else {
    document.getElementById('pin-error').textContent = 'PIN incorrecto';
    pinActual = '';
    actualizarPinDots();
  }
}

const fmt = n => new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(n||0);
const fmtN = n => new Intl.NumberFormat('es-MX').format(n||0);
const today = () => new Date().toISOString().split('T')[0];
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const badge = (t,c) => `<span class="badge" style="background:${c}18;color:${c}">${esc(t)}</span>`;
const kpi = (icon,val,label,color='#1A2744',sub='') => `<div class="kpi"><div class="kpi-icon">${icon}</div><div class="kpi-val" style="color:${color}">${val}</div><div class="kpi-label">${label}</div>${sub?`<div style="font-size:9px;color:#6B7A99;margin-top:1px">${sub}</div>`:''}</div>`;
const toast = msg => { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500); };

function calcularConsumo(lineas) {
  const c={};
  for(const l of lineas) {
    const f=FORMULAS[l.productoId]; if(!f) continue;
    const factor = f.tipo==='consome' ? l.cantidad/100 : l.cantidad;
    for(const [k,v] of Object.entries(f.formula)) c[k]=(c[k]||0)+v*factor;
  }
  return c;
}

// FIREBASE SYNC
// ═══════════════════════════════════════════════════════
function iniciarApp() {
  render();
  // Sincronizar stockMP
  db.collection('stockMP').onSnapshot(snap => {
    snap.docs.forEach(doc => {
      const d = doc.data();
      const idx = mp.findIndex(i=>i.id===doc.id);
      if(idx>=0) mp[idx] = {...mp[idx], ...d, id:doc.id};
    });
    document.getElementById('logo-sub').textContent = '🟢 En vivo · Firebase conectado';
    fbConectado = true;
    if(currentTab==='mp'||currentTab==='dashboard') render();
  }, ()=>{});

  // Sincronizar stockPT
  db.collection('stockPT').onSnapshot(snap => {
    snap.docs.forEach(doc => {
      const d = doc.data();
      const idx = pt.findIndex(i=>i.id===doc.id);
      if(idx>=0) pt[idx] = {...pt[idx], ...d, id:doc.id};
    });
    if(currentTab==='pt'||currentTab==='dashboard') render();
  }, ()=>{});

  // Sincronizar historialMP
  db.collection('historialMP').onSnapshot(snap => {
    const fbMovs = snap.docs.map(doc=>({...doc.data(),fbId:doc.id}));
    // Merge: evitar duplicados por fbId
    const ids = new Set(movMP.filter(m=>m.fbId).map(m=>m.fbId));
    fbMovs.forEach(m=>{ if(!ids.has(m.fbId)) movMP.push({...m,id:nextId++}); });
    if(currentTab==='mp') render();
  }, ()=>{});

  // Pedidos de Firebase
  db.collection('pedidosYgarmex').onSnapshot(snap => {
    const fbPeds = snap.docs.map(doc=>({...doc.data(),fbId:doc.id,id:'fb_'+doc.id}));
    pedidos = fbPeds;
    if(['ventas','cobros','dashboard'].includes(currentTab)) render();
  }, ()=>{});

  // Actualizar badge alertas
  setInterval(actualizarBadge, 3000);
}

async function fbGuardarMovMP(matId, nombre, tipo, cantidad, nota, nuevoStock, unidad) {
  const mov = {materialId:matId, nombre, tipo, cantidad, nota, fecha:today(),
    stockDespues:nuevoStock, unidad, creadoEn:new Date().toISOString()};
  try {
    const ref = await db.collection('historialMP').add(mov);
    await db.collection('stockMP').doc(matId).set({...mp.find(i=>i.id===matId), cantidad:nuevoStock});
    return ref.id;
  } catch(e) { console.warn('FB error:', e); return null; }
}

async function fbGuardarMovPT(ptId, nombre, tipo, cantidad, nota, nuevoStock) {
  try {
    await db.collection('stockPT').doc(ptId).set({...pt.find(i=>i.id===ptId), cantidad:nuevoStock});
  } catch(e) { console.warn('FB PT error:', e); }
}

function openModal(title,body) {
  document.getElementById('modal-title').textContent=title;

async function confirmarEntradaMP() {

  const btn=document.getElementById('btn-emp'); btn.textContent='Guardando…'; btn.disabled=true;
  const item=mp.find(i=>i.id===matId);
  const nuevoStock=item.stock+cant;
  mp=mp.map(i=>i.id===matId?{...i,stock:nuevoStock}:i);
  const fbId=await fbGuardarMovMP(matId,item.nombre,'entrada',cant,prov+(nota?' · '+nota:''),nuevoStock,item.unidad);
  movMP.push({id:nextId++,fecha,materialId:matId,nombre:item.nombre,tipo:'entrada',cantidad:cant,nota:prov+(nota?' · '+nota:''),fbId,unidad:item.unidad});

async function confirmarMovMP(id,tipo) {
  const item=mp.find(i=>i.id===id);
  const cant=parseFloat(document.getElementById('mmmp-cant').value)||0;
  const nota=document.getElementById('mmmp-nota').value;
  if(!item||cant<=0){alert('Cantidad inválida');return;}
  if(tipo==='S'&&cant>item.stock&&!confirm(`⚠️ Solo hay ${item.stock} ${item.unidad}. ¿Continuar?`))return;
  const btn=document.getElementById('btn-mmmp'); btn.textContent='Guardando…'; btn.disabled=true;
  const nuevoStock=Math.max(0,item.stock+(tipo==='E'?cant:-cant));
  mp=mp.map(i=>i.id===id?{...i,stock:nuevoStock}:i);
  const tipoStr=tipo==='E'?'entrada':'salida';
  const fbId=await fbGuardarMovMP(id,item.nombre,tipoStr,cant,nota,nuevoStock,item.unidad);
  movMP.push({id:nextId++,fecha:today(),materialId:id,nombre:item.nombre,tipo:tipoStr,cantidad:cant,nota,fbId,unidad:item.unidad});
  toast(`${tipo==='E'?'✅ Entrada':'📤 Salida'}: ${cant} ${item.unidad} de ${item.nombre}`);
  closeModal(); render();
}

// ═══════════════════════════════════════════════════════
// CORREGIR MOVIMIENTO
// ═══════════════════════════════════════════════════════
function openModalCorregir(coleccion, itemId, movId, cantOriginal, tipoOriginal) {
  openModal('✏️ Corregir movimiento',`
    <p style="color:#6B7A99;font-size:13px;margin-bottom:14px">Movimiento original: <b>${tipoOriginal}</b> de <b>${cantOriginal}</b></p>
    <div class="form-group"><label class="form-label">Cantidad correcta</label>
      <input class="form-input" id="cor-cant" type="number" step="0.01" inputmode="decimal" value="${cantOriginal}"></div>
    <div class="form-group"><label class="form-label">Tipo correcto</label>
      <select class="form-select" id="cor-tipo">
        <option value="entrada" ${tipoOriginal==='entrada'?'selected':''}>Entrada</option>
        <option value="salida" ${tipoOriginal==='salida'?'selected':''}>Salida</option>
      </select></div>
    <div class="form-group"><label class="form-label">Motivo de corrección</label>
      <input class="form-input" id="cor-nota" placeholder="ej. Error de captura"></div>
    <button class="btn btn-warn btn-full" onclick="confirmarCorreccion('${coleccion}','${itemId}','${movId}',${cantOriginal},'${tipoOriginal}')">✅ Aplicar corrección</button>
    <button class="btn btn-danger btn-full" style="margin-top:6px" onclick="eliminarMovimiento('${coleccion}','${itemId}','${movId}',${cantOriginal},'${tipoOriginal}')">🗑️ Eliminar este movimiento</button>`);
}

async function confirmarCorreccion(col, itemId, movId, cantOriginal, tipoOriginal) {
  const nuevaCant=parseFloat(document.getElementById('cor-cant').value)||0;
  const nuevoTipo=document.getElementById('cor-tipo').value;
  const notaCorr=document.getElementById('cor-nota').value;
  if(nuevaCant<=0){alert('Cantidad inválida');return;}

  if(col==='mp') {
    const item=mp.find(i=>i.id===itemId);
    // Revertir original
    const revertido=item.stock+(tipoOriginal==='entrada'?-cantOriginal:cantOriginal);
    // Aplicar nuevo
    const nuevo=revertido+(nuevoTipo==='entrada'?nuevaCant:-nuevaCant);
    mp=mp.map(i=>i.id===itemId?{...i,stock:Math.max(0,nuevo)}:i);
    await db.collection('stockMP').doc(itemId).set({...item,stock:Math.max(0,nuevo)});
    if(movId && movId.length>5 && isNaN(movId)) { // es fbId
      await db.collection('historialMP').doc(movId).update({cantidad:nuevaCant,tipo:nuevoTipo,nota:'[CORREGIDO] '+notaCorr});
    }
    toast('✅ Corrección aplicada');
  }
  closeModal(); render();
}

async function eliminarMovimiento(col, itemId, movId, cantOriginal, tipoOriginal) {
  if(!confirm('¿Eliminar este movimiento? El stock se ajustará.')) return;
  if(col==='mp') {
    const item=mp.find(i=>i.id===itemId);
    const nuevoStock=item.stock+(tipoOriginal==='entrada'?-cantOriginal:cantOriginal);
    mp=mp.map(i=>i.id===itemId?{...i,stock:Math.max(0,nuevoStock)}:i);
    await db.collection('stockMP').doc(itemId).set({...item,stock:Math.max(0,nuevoStock)});
    if(movId && isNaN(movId)) await db.collection('historialMP').doc(movId).delete();
    movMP=movMP.filter(m=>m.fbId!==movId&&String(m.id)!==String(movId));
    toast('🗑️ Movimiento eliminado');
  }
  closeModal(); render();
}

// PRODUCCIÓN
// ═══════════════════════════════════════════════════════
function tabProduccion() {
  const consumoPreview=calcularConsumo(
    prodLineas.filter(l=>l.productoId&&parseFloat(l.cantidad)>0)
      .map(l=>({productoId:l.productoId,cantidad:parseFloat(l.cantidad)}))
  );
  const tieneConsumo=Object.keys(consumoPreview).length>0;

  let html=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div style="font-weight:700;font-size:13px">🏭 Registrar Producción</div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <h4 style="margin:0">Productos producidos hoy</h4>
        <button class="btn btn-sm btn-primary" onclick="agregarLineaProd()">+ Agregar</button>
      </div>
      <div id="prod-lineas">
        ${prodLineas.map((l,i)=>`
          <div class="prod-linea">
            <div class="prod-linea-header">
              <span class="prod-linea-num">Producto ${i+1}</span>
              ${prodLineas.length>1?`<button class="btn btn-sm btn-danger" onclick="quitarLineaProd(${i})">Quitar</button>`:''}
            </div>
            <div class="form-group"><label class="form-label">Producto</label>
              <select class="form-select" onchange="actualizarLineaProd(${i},'productoId',this.value)">
                <option value="">Selecciona…</option>
                <optgroup label="Consomé">
                  ${Object.entries(FORMULAS).filter(([k,v])=>v.tipo==='consome').map(([k,v])=>`<option value="${k}" ${l.productoId===k?'selected':''}>${v.label}</option>`).join('')}
                </optgroup>
                <optgroup label="Gelatina">
                  ${Object.entries(FORMULAS).filter(([k,v])=>v.tipo==='gelatina').map(([k,v])=>`<option value="${k}" ${l.productoId===k?'selected':''}>${v.label}</option>`).join('')}
                </optgroup>
              </select>
            </div>
            <div class="form-group"><label class="form-label">${l.productoId&&FORMULAS[l.productoId]?.tipo==='gelatina'?'Revolturas':'Kg producidos'}</label>
              <input class="form-input" type="number" step="0.5" value="${l.cantidad}" inputmode="decimal"
                oninput="actualizarLineaProd(${i},'cantidad',this.value)"
                placeholder="${l.productoId&&FORMULAS[l.productoId]?.tipo==='gelatina'?'ej. 3':'ej. 500'}">
            </div>
          </div>`).join('')}
      </div>
      ${tieneConsumo?`<div class="consumo-preview">
        <div style="font-weight:700;font-size:12px;color:#065f46;margin-bottom:6px">📉 MP que se desconta automáticamente:</div>
        ${Object.entries(consumoPreview).map(([matId,kg])=>{
          const mat=mp.find(m=>m.id===matId);
          const insuf=mat&&kg>mat.stock;
          return `<div class="consumo-row" style="color:${insuf?'#C1442D':'#1a7a56'}">
            <span>${mat?.nombre||matId}</span>
            <span>${insuf?'⚠️ ':''}<b>−${fmtN(Math.round(kg*100)/100)}</b> ${mat?.unidad||'kg'}${insuf?` (solo hay ${fmtN(mat?.stock||0)})`:''}</span>
          </div>`;
        }).join('')}
      </div>`:''}
      <div style="display:flex;gap:8px;margin-top:12px">
        <input class="form-input" id="prod-fecha" type="date" value="${today()}" style="flex:1">
        <button class="btn btn-primary" onclick="registrarProduccion()" style="flex:2" id="btn-prod">✅ Registrar y descontar MP</button>
      </div>
    </div>`;

  if(registrosProd.length>0) {
    html+=`<div class="card"><h4>📋 Historial de Producción</h4>
      <div class="tbl-wrap"><table><thead><tr><th>Fecha</th><th>Producción</th><th>MP descontada</th></tr></thead><tbody>
        ${[...registrosProd].reverse().slice(0,10).map(r=>`<tr>
          <td>${r.fecha}</td>
          <td style="font-size:11px">${r.lineas.map(l=>FORMULAS[l.productoId]?.label+' '+fmtN(l.cantidad)+(FORMULAS[l.productoId]?.tipo==='gelatina'?' rev':' kg')).join('<br>')}</td>
          <td style="font-size:11px;color:#6B7A99">${Object.entries(r.consumo).map(([k,v])=>{const m=mp.find(x=>x.id===k);return(m?.nombre||k)+': −'+fmtN(Math.round(v*100)/100)}).join('<br>')}</td>
        </tr>`).join('')}
      </tbody></table></div></div>`;
  }
  return html;
}

function agregarLineaProd(){prodLineas=[...prodLineas,{productoId:'',cantidad:''}];render();}
function quitarLineaProd(i){prodLineas=prodLineas.filter((_,j)=>j!==i);render();}
function actualizarLineaProd(i,campo,valor){prodLineas=prodLineas.map((l,j)=>j===i?{...l,[campo]:valor}:l);render();}

async function registrarProduccion() {
  const lineasValidas=prodLineas.filter(l=>l.productoId&&parseFloat(l.cantidad)>0).map(l=>({productoId:l.productoId,cantidad:parseFloat(l.cantidad)}));
  if(!lineasValidas.length){alert('Agrega al menos un producto con cantidad');return;}
  const fecha=document.getElementById('prod-fecha').value;
  const consumo=calcularConsumo(lineasValidas);
  const insuf=Object.entries(consumo).filter(([k,v])=>{const m=mp.find(x=>x.id===k);return m&&v>m.stock;});
  if(insuf.length>0) {
    const msgs=insuf.map(([k,v])=>{const m=mp.find(x=>x.id===k);return`${m.nombre}: necesitas ${fmtN(Math.round(v*10)/10)}, hay ${fmtN(m.stock)}`;});
    if(!confirm(`⚠️ MP insuficiente:\n${msgs.join('\n')}\n\n¿Registrar de todas formas?`))return;
  }
  const btn=document.getElementById('btn-prod'); btn.textContent='Guardando…'; btn.disabled=true;
  for(const [matId,kg] of Object.entries(consumo)) {
    const mat=mp.find(m=>m.id===matId); if(!mat) continue;
    const nuevoStock=Math.max(0,mat.stock-kg);
    mp=mp.map(m=>m.id===matId?{...m,stock:nuevoStock}:m);
    const nota='Producción: '+lineasValidas.map(l=>FORMULAS[l.productoId]?.label).join(', ');
    const fbId=await fbGuardarMovMP(matId,mat.nombre,'produccion',Math.round(kg*100)/100,nota,nuevoStock,mat.unidad);
    movMP.push({id:nextId++,fecha,materialId:matId,nombre:mat.nombre,tipo:'produccion',cantidad:Math.round(kg*100)/100,nota,fbId,unidad:mat.unidad});
  }
  registrosProd.push({id:nextId++,fecha,lineas:lineasValidas,consumo});
  prodLineas=[{productoId:'',cantidad:''}];
  toast('✅ Producción registrada. MP descontada automáticamente.');
  render();
}

// PRODUCTO TERMINADO

function tabPT() {
  const items=ptFiltro==='todos'?pt:pt.filter(i=>i.stock<=i.minimo);
  const valor=pt.reduce((s,i)=>s+i.stock*i.precio,0);
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">
      <div class="tab-bar" style="margin-bottom:0">
        <button class="tab-btn ${ptFiltro==='todos'?'active':''}" onclick="ptFiltro='todos';render()">Todos</button>
        <button class="tab-btn ${ptFiltro==='bajo'?'active':''}" onclick="ptFiltro='bajo';render()">⚠️ Bajo mínimo</button>
      </div>
    </div>
    <div class="kpi-row">
      ${kpi('💰',fmt(valor),'Valor en stock')}
      ${kpi('⚠️',pt.filter(i=>i.stock<=i.minimo).length,'Bajo mínimo','#C1442D')}
      ${kpi('✅',pt.filter(i=>i.stock>i.minimo).length,'OK','#2ECC8F')}
    </div>
    <div class="card"><div class="tbl-wrap"><table>
      <thead><tr><th>Producto</th><th>Stock</th><th>Mín</th><th>Unidad</th><th></th></tr></thead>
      <tbody>
        ${items.map(i=>{const bajo=i.stock<=i.minimo;return`<tr>
          <td><b>${esc(i.nombre)}</b></td>
          <td><b style="color:${bajo?'#C1442D':'#1A2744'}">${fmtN(i.stock)}</b></td>
          <td>${fmtN(i.minimo)}</td>
          <td style="font-size:10px;color:#6B7A99">${esc(i.unidad)}</td>
          <td style="white-space:nowrap">
            <button class="btn btn-success btn-sm" onclick="openModalMovPT('${i.id}','E')">+</button>
            <button class="btn btn-danger btn-sm" onclick="openModalMovPT('${i.id}','S')" style="margin-left:3px">−</button>
          </td>
        </tr>`;}).join('')}
      </tbody>
    </table></div></div>`;
}

function openModalMovPT(id,tipo) {
  const item=pt.find(i=>i.id===id);
  openModal(tipo==='E'?`📥 Entrada — ${item.nombre}`:`📤 Salida — ${item.nombre}`,`
    <p style="color:#6B7A99;font-size:13px;margin-bottom:12px">Stock actual: <b>${fmtN(item.stock)} ${esc(item.unidad)}</b></p>
    <div class="form-group"><label class="form-label">Cantidad</label>
      <input class="form-input" id="mmpt-cant" type="number" inputmode="decimal"></div>
    <div class="form-group"><label class="form-label">Nota</label>
      <input class="form-input" id="mmpt-nota" placeholder="Motivo, cliente, producción…"></div>
    <button class="btn ${tipo==='E'?'btn-success':'btn-danger'} btn-full" id="btn-mmpt" onclick="confirmarMovPT('${id}','${tipo}')">✅ Confirmar ${tipo==='E'?'Entrada':'Salida'}</button>`);
}

async function confirmarMovPT(id,tipo) {
  const item=pt.find(i=>i.id===id);
  const cant=parseFloat(document.getElementById('mmpt-cant').value)||0;
  const nota=document.getElementById('mmpt-nota').value;
  if(!item||cant<=0){alert('Cantidad inválida');return;}
  const btn=document.getElementById('btn-mmpt'); btn.textContent='Guardando…'; btn.disabled=true;
  const nuevoStock=Math.max(0,item.stock+(tipo==='E'?cant:-cant));
  pt=pt.map(i=>i.id===id?{...i,stock:nuevoStock}:i);
  await fbGuardarMovPT(id,item.nombre,tipo==='E'?'entrada':'salida',cant,nota,nuevoStock);
  movPT.push({id:nextId++,fecha:today(),ptId:id,nombre:item.nombre,tipo:tipo==='E'?'entrada':'salida',cantidad:cant,nota});
  toast(`${tipo==='E'?'✅ Entrada':'📤 Salida'}: ${cant} ${item.unidad} de ${item.nombre}`);
  closeModal(); render();
}

// ═══════════════════════════════════════════════════════
function getNombreCliente(p) {
  if(p.clienteNombre) return p.clienteNombre;
  if(p.clienteId){const c=clientes.find(x=>x.id===p.clienteId);if(c)return c.nombre;}
  return '—';
}

function tabVentas() {
  const total=pedidos.reduce((s,p)=>s+(p.monto||0),0);
  const xCob=pedidos.filter(p=>p.status!=='entregado').reduce((s,p)=>s+(p.monto||0),0);
  return `
    <div style="margin-bottom:12px;display:flex;justify-content:space-between;align-items:center">
      <div style="font-weight:700;font-size:13px">🛒 Ventas & Pedidos</div>
    </div>
    <div class="kpi-row">
      ${kpi('📋',pedidos.length,'Pedidos')}
      ${kpi('💵',fmt(total),'Facturado')}
      ${kpi('⏳',fmt(xCob),'Por cobrar','#F5820D')}
    </div>
    <div class="card"><div class="tbl-wrap"><table>
      <thead><tr><th>Fecha</th><th>Cliente</th><th>Importe</th><th>Estado</th><th></th></tr></thead>
      <tbody>
        ${[...pedidos].sort((a,b)=>(b.fechaEntrega||'').localeCompare(a.fechaEntrega||'')).map(p=>`<tr>
          <td>${p.fechaEntrega||p.fecha||''}</td>
          <td><b>${esc(getNombreCliente(p))}</b></td>
          <td>${fmt(p.monto)}</td>
          <td>${badge(p.status==='entregado'?'Entregado':p.status==='surtido'?'En ruta':'Pendiente',p.status==='entregado'?'#2ECC8F':p.status==='surtido'?'#1B2A4A':'#F5820D')}</td>
          <td>${p.status!=='entregado'?`<button class="btn btn-success btn-sm" onclick="cobrarPedido('${p.fbId||p.id}')">✓</button>`:''}</td>
        </tr>`).join('')||'<tr><td colspan="5" style="text-align:center;color:#6B7A99;padding:20px">Sin pedidos</td></tr>'}
      </tbody>
    </table></div></div>
    <div class="card"><h4>👥 Clientes clave</h4>
      ${clientes.filter(c=>c.nota&&c.nota.includes('⚠')).map(c=>`<div style="padding:8px 0;border-bottom:1px solid #F0F2F7;font-size:12px">
        <b>${esc(c.nombre)}</b><br>
        <span style="color:#F5820D">${esc(c.nota)}</span>
      </div>`).join('')}
    </div>`;
}

async function cobrarPedido(fbId) {
  try {
    await db.collection('pedidosYgarmex').doc(fbId).update({status:'entregado'});
    toast('✅ Pedido marcado como entregado');
  } catch(e){ toast('❌ Error al actualizar'); }
}

// ═══════════════════════════════════════════════════════
// COBROS
// ═══════════════════════════════════════════════════════
function tabCobros() {
  const pend=pedidos.filter(p=>p.status!=='entregado');
  const pag=pedidos.filter(p=>p.status==='entregado');
  const xCob=pend.reduce((s,p)=>s+(p.monto||0),0);

  const porCli=clientes.map(c=>{
    const ps=pend.filter(p=>(p.clienteNombre||'').toLowerCase().includes(c.nombre.split('–')[0].trim().toLowerCase()));
    return{...c,ps,total:ps.reduce((s,p)=>s+(p.monto||0),0)};
  }).filter(c=>c.total>0).sort((a,b)=>b.total-a.total);
  const filas=cobrosVista==='pendiente'?pend:pag;

  return `
    <div class="kpi-row">
      ${kpi('⏳',fmt(xCob),'Por cobrar','#F5820D',pend.length+' pedidos')}
      ${kpi('✅',fmt(cob),'Cobrado','#2ECC8F',pag.length+' pedidos')}
      ${kpi('👥',porCli.length,'Clientes con saldo',porCli.length?'#F5820D':'#2ECC8F')}
    </div>
    ${porCli.length?`<div class="card"><h4>📋 Saldo por Cliente</h4>
      ${porCli.slice(0,8).map(c=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#FFF3E0;border-radius:9px;margin-bottom:7px">
        <div>
          <div style="font-weight:700;font-size:13px">${esc(c.nombre.split('–')[0].trim())}</div>
          <div style="font-size:11px;color:#6B7A99">${c.ps.length} pedido${c.ps.length!==1?'s':''}</div>
        </div>
        <span style="font-size:16px;font-weight:800;color:#F5820D">${fmt(c.total)}</span>
      </div>`).join('')}
    </div>`:''}
    <div class="card">
      <div class="tab-bar">
        <button class="tab-btn ${cobrosVista==='pendiente'?'active':''}" onclick="cobrosVista='pendiente';render()">⏳ Pendientes</button>
        <button class="tab-btn ${cobrosVista==='pagado'?'active':''}" onclick="cobrosVista='pagado';render()">✅ Cobrados</button>
      </div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Fecha</th><th>Cliente</th><th>Importe</th><th>Rem.</th><th></th></tr></thead>
        <tbody>
          ${filas.map(p=>`<tr>
            <td>${p.fechaEntrega||p.fecha||''}</td>
            <td>${esc(getNombreCliente(p))}</td>
            <td>${fmt(p.monto)}</td>
            <td style="font-size:11px;color:#6B7A99">${esc(p.remision||'—')}</td>
            <td>${p.status!=='entregado'?`<button class="btn btn-success btn-sm" onclick="cobrarPedido('${p.fbId||p.id}')">✓</button>`:''}</td>
          </tr>`).join('')||`<tr><td colspan="5" style="text-align:center;color:#6B7A99;padding:20px">${cobrosVista==='pendiente'?'🎉 Sin pendientes':'Sin cobros'}</td></tr>`}
        </tbody>
      </table></div>
    </div>`;
}

// Iniciar
render();
