<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#F0F2F7;color:#1A2744;font-size:14px;padding-bottom:80px;}
:root{--navy:#1B2A4A;--orange:#F5820D;--green:#2ECC8F;--red:#C1442D;--yellow:#D98E2B;--bg:#F0F2F7;--card:#fff;--muted:#6B7A99;--border:#DDE3F0;}
#header{background:var(--navy);position:sticky;top:0;z-index:100;padding:0 14px;}
#header-top{display:flex;align-items:center;justify-content:space-between;padding:10px 0 6px;}
#logo{display:flex;align-items:center;gap:10px;}
#logo-icon{background:var(--orange);border-radius:9px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:16px;}
#logo-text{color:#fff;font-weight:800;font-size:14px;}
#logo-sub{color:#8899BB;font-size:9px;}
#nav-icons{display:flex;gap:2px;}
.nav-btn{background:none;border:none;cursor:pointer;padding:6px 8px;border-radius:8px;font-size:16px;position:relative;color:#8899BB;}
.nav-btn.active{background:rgba(245,130,13,.2);color:var(--orange);}
#alert-badge{position:absolute;top:4px;right:4px;background:var(--red);color:#fff;border-radius:99px;width:13px;height:13px;font-size:8px;font-weight:800;display:flex;align-items:center;justify-content:center;}
#nav-labels{display:flex;}
.nav-label{flex:1;text-align:center;font-size:9px;font-weight:700;color:#8899BB;padding:4px 0 8px;cursor:pointer;border-bottom:2px solid transparent;}
.nav-label.active{color:var(--orange);border-bottom-color:var(--orange);}
#content{padding:14px 12px;max-width:960px;margin:0 auto;}
.card{background:var(--card);border-radius:12px;padding:16px;box-shadow:0 1px 4px rgba(26,39,68,.08);margin-bottom:12px;}
.card h4{font-size:13px;color:var(--navy);margin-bottom:10px;}
.kpi-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.kpi{background:var(--card);border-radius:12px;padding:13px;flex:1;min-width:110px;box-shadow:0 1px 4px rgba(26,39,68,.08);}
.kpi-icon{font-size:18px;margin-bottom:2px;}
.kpi-val{font-size:20px;font-weight:800;line-height:1.1;}
.kpi-label{font-size:10px;color:var(--muted);margin-top:3px;}
.hist-row{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff;}
.hist-row-dim{background:#F7F5F0;opacity:0.85;}
.hist-row-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;}
.hist-qty{font-weight:800;font-size:15px;color:#4F7858;}
.hist-fecha{font-size:12px;color:#6B7A99;}
.hist-prov{font-size:13px;font-weight:600;margin-bottom:2px;}
.hist-notas{font-size:12px;color:#6B7A99;line-height:1.4;}
.hist-tag{display:flex;align-items:center;gap:4px;font-size:11px;color:#D98E2B;margin-top:4px;font-weight:600;}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;}
.btn{border:none;border-radius:8px;cursor:pointer;font-weight:700;font-family:inherit;font-size:13px;padding:8px 16px;}
.btn-primary{background:var(--orange);color:#fff;}
.btn-ghost{background:transparent;color:var(--navy);border:1.5px solid var(--border);}
.btn-success{background:#E8FAF3;color:#1a7a56;border:1.5px solid rgba(46,204,143,.4);}
.btn-danger{background:#FFF5F5;color:var(--red);border:1.5px solid rgba(193,68,45,.25);}
.btn-sm{padding:5px 10px;font-size:11px;}
.btn-full{width:100%;margin-top:6px;}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th{padding:7px 10px;text-align:left;color:var(--muted);font-size:11px;font-weight:700;border-bottom:2px solid var(--border);white-space:nowrap;}
td{padding:8px 10px;color:var(--navy);border-bottom:1px solid var(--border);}
tr:nth-child(even) td{background:#FAFBFD;}
.tab-bar{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
.tab-btn{padding:6px 13px;border-radius:8px;border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:12px;background:var(--border);color:var(--muted);}
.tab-btn.active{background:var(--navy);color:#fff;}
.silo-wrap{width:32px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;}
.silo-cap{width:36px;height:6px;background:#D8D2C2;border-radius:4px 4px 0 0;margin-bottom:-1px;}
.silo-body{width:32px;height:60px;background:#EFEAE0;border-radius:0 0 8px 8px;overflow:hidden;display:flex;align-items:flex-end;border:1px solid #DDD6C7;}
.silo-fill{width:100%;transition:height .3s ease;}
.alert-strip{background:#2A1B05;color:#FCE8C8;margin-bottom:12px;border-radius:12px;padding:10px 14px;border:1px solid #D98E2B55;}
.alert-strip-head{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin-bottom:8px;}
.alert-item-row{display:flex;justify-content:space-between;padding:5px 0;font-size:12px;border-bottom:1px solid #D98E2B33;}
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:999;align-items:flex-end;justify-content:center;}
#modal-overlay.open{display:flex;}
#modal-box{background:#fff;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:20px 16px 30px;max-height:88vh;overflow-y:auto;}
#modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
#modal-title{font-size:15px;font-weight:700;color:var(--navy);}
#modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted);}
.form-group{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;}
.form-label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.3px;}
.form-input,.form-select{border:1.5px solid var(--border);border-radius:8px;padding:9px 10px;font-size:14px;color:var(--navy);outline:none;font-family:inherit;background:#fff;width:100%;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.prod-linea{background:#F7F5F0;border-radius:10px;padding:12px;margin-bottom:8px;border:1px solid var(--border);}
.prod-linea-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.prod-linea-num{font-size:11px;font-weight:700;color:var(--orange);background:#FFF3E0;padding:2px 8px;border-radius:99px;}
.consumo-preview{background:#E8FAF3;border-radius:8px;padding:10px;margin-top:10px;font-size:12px;}
.consumo-row{display:flex;justify-content:space-between;padding:2px 0;color:#1a7a56;}
.bar-wrap{background:var(--border);border-radius:99px;height:5px;margin-top:3px;}
.bar-fill{height:5px;background:var(--orange);border-radius:99px;}
.sync-banner{background:#1a4a2a;color:#a7f3d0;padding:8px 14px;border-radius:8px;font-size:11px;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
</style>

const fmt=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(n||0);
const fmtN=n=>new Intl.NumberFormat('es-MX').format(n||0);
const today=()=>new Date().toISOString().split('T')[0];
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const badge=(t,c)=>`<span class="badge" style="background:${c}18;color:${c}">${esc(t)}</span>`;
const kpi=(icon,val,label,color='#1A2744',sub='')=>`<div class="kpi"><div class="kpi-icon">${icon}</div><div class="kpi-val" style="color:${color}">${val}</div><div class="kpi-label">${label}</div>${sub?`<div style="font-size:9px;color:#6B7A99;margin-top:1px">${sub}</div>`:''}</div>`;

function calcularConsumo(lineas) {
  const consumo = {};
  for (const l of lineas) {
    const f = FORMULAS[l.productoId]; if(!f) continue;
    const factor = f.tipo==='consome' ? l.cantidad/100 : l.cantidad;
    for (const [matId,kg] of Object.entries(f.formula)) consumo[matId]=(consumo[matId]||0)+kg*factor;
  }
  return consumo;
}

// FIREBASE — CARGAR / GUARDAR
// ═══════════════════════════════════════════════════════
async function cargarDesdeFirebase() {
  try {
    // MP
    const snapMP = await db.collection('stockMP').get();
    if (snapMP.empty) {
      // Primera vez: subir datos base
      const batch = db.batch();
      MP_BASE.forEach(item => batch.set(db.collection('stockMP').doc(item.id), item));
      await batch.commit();
      mp = [...MP_BASE];
    } else {
      mp = snapMP.docs.map(d => ({...d.data(), id: d.id}));
      // Agregar items que no existan aún
      for (const base of MP_BASE) {
        if (!mp.find(x => x.id === base.id)) {
          await db.collection('stockMP').doc(base.id).set(base);
          mp.push(base);
        }
      }
    }

    // PT
    const snapPT = await db.collection('stockPT').get();
    if (snapPT.empty) {
      const batch = db.batch();
      PT_BASE.forEach(item => batch.set(db.collection('stockPT').doc(item.id), item));
      await batch.commit();
      pt = [...PT_BASE];
    } else {
      pt = snapPT.docs.map(d => ({...d.data(), id: d.id}));
      for (const base of PT_BASE) {
        if (!pt.find(x => x.id === base.id)) {
          await db.collection('stockPT').doc(base.id).set(base);
          pt.push(base);
        }
      }
    }

    // Movimientos MP
    const snapMovMP = await db.collection('movimientosMP').limit(50).get();
    movMP = snapMovMP.docs.map(d => ({...d.data(), id: d.id}));

    // Movimientos PT
    const snapMovPT = await db.collection('movimientosPT').limit(50).get();
    movPT = snapMovPT.docs.map(d => ({...d.data(), id: d.id}));

    // Producciones
    const snapProd = await db.collection('produccion').limit(30).get();
    registrosProd = snapProd.docs.map(d => ({...d.data(), id: d.id}));

    fbListo = true;
    actualizarSubtitulo('🟢 Firebase · conteo 24-jul-2026');
  } catch(e) {
    console.error('Error Firebase:', e);
    mp = [...MP_BASE];
    pt = [...PT_BASE];
    actualizarSubtitulo('🔴 Sin conexión · datos locales');
  }

  // Escuchar pedidos en tiempo real
  escucharPedidos();
  render();
}

  const el = document.getElementById('logo-sub');
  if(el) el.textContent = txt;

function escucharPedidos() {
  db.collection('pedidosYgarmex').onSnapshot(snap => {
    pedidosFB = snap.docs.map(d => {
      const data = d.data();
      const prods = (data.productos||[]);
      const producto = prods.map(p=>`${p.cant} ${p.unidad} ${p.nombre}`).join(' + ') || '—';
      return {
        id: d.id, folio: data.folio||d.id,
        clienteNombre: data.clienteNombre||'—',
        clienteZona: data.clienteZona||'',
        fecha: data.fecha||'',
        producto, total: data.total||0,
        estado: data.estado||'pendiente',
        factura: data.factura||'',
        notas: data.notas||'',
      };
    });
    if(currentTab==='ventas'||currentTab==='cobros'||currentTab==='dashboard') render();
  }, e => console.warn('Pedidos:', e.message));
}

function openModal(title, body) {
  document.getElementById('modal-title').textContent = title;

function actualizarLineaProd(i,campo,valor){prodLineas=prodLineas.map((l,j)=>j===i?{...l,[campo]:valor}:l);render();}

async function registrarProduccion() {
  const lineasValidas=prodLineas.filter(l=>l.productoId&&parseFloat(l.cantidad)>0).map(l=>({productoId:l.productoId,cantidad:parseFloat(l.cantidad)}));
  if(!lineasValidas.length){alert('Agrega al menos un producto');return;}
  const fecha=document.getElementById('prod-fecha').value;
  const ptId=document.getElementById('prod-pt-id').value;
  const ptCant=parseFloat(document.getElementById('prod-pt-cant').value)||0;
  const consumo=calcularConsumo(lineasValidas);
  // Descontar MP
  for(const [matId,kg] of Object.entries(consumo)){
    const mat=mp.find(m=>m.id===matId); if(!mat) continue;
    const nuevoStock=Math.max(0,mat.stock-kg);
    mp=mp.map(m=>m.id===matId?{...m,stock:nuevoStock}:m);
    await guardarStockMP(matId,nuevoStock);
    await guardarMovMP({fecha,matId,nombre:mat.nombre,tipo:'salida',cantidad:Math.round(kg*100)/100,nota:'Producción: '+lineasValidas.map(l=>FORMULAS[l.productoId]?.label).join(', ')});
  }
  // Sumar PT
  if(ptId&&ptCant>0){
    const item=pt.find(p=>p.id===ptId);
    if(item){
      const nuevoStock=(item.stock||0)+ptCant;
      pt=pt.map(p=>p.id===ptId?{...p,stock:nuevoStock}:p);
      await guardarStockPT(ptId,nuevoStock);
      await guardarMovPT({fecha,ptId,nombre:item.nombre,tipo:'entrada',cantidad:ptCant,nota:'Producción '+fecha});
    }
  }
  const desc=lineasValidas.map(l=>FORMULAS[l.productoId]?.label+' '+fmtN(l.cantidad)+(FORMULAS[l.productoId]?.tipo==='gelatina'?' rev':' kg')).join(', ')+(ptId&&ptCant?` → +${ptCant} ${pt.find(p=>p.id===ptId)?.nombre||''}`:' ');
  const reg={fecha,descripcion:desc,lineas:lineasValidas,consumo};
  registrosProd.unshift(reg);
  await guardarProduccion(reg);
  prodLineas=[{productoId:'',cantidad:''}];
  alert('✅ Producción registrada y guardada en Firebase');
  render();
}

let ptFiltro='todos';
function tabPT() {
  const items=ptFiltro==='todos'?pt:pt.filter(i=>i.stock<=i.minimo);
  const valorTotal=pt.reduce((s,i)=>s+i.stock*i.precio,0);
  return `
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:12px">
      <div class="tab-bar" style="margin-bottom:0">
        <button class="tab-btn ${ptFiltro==='todos'?'active':''}" onclick="ptFiltro='todos';render()">Todos</button>
        <button class="tab-btn ${ptFiltro==='bajo'?'active':''}" onclick="ptFiltro='bajo';render()">⚠️ Bajo mínimo</button>
      </div>
    </div>
    <div class="kpi-row">
      ${kpi('💰',fmt(valorTotal),'Valor en stock','#1A2744')}
      ${kpi('⚠️',pt.filter(i=>i.stock<=i.minimo).length,'Bajo mínimo','#C1442D')}
      ${kpi('✅',pt.filter(i=>i.stock>i.minimo).length,'OK','#2ECC8F')}
    </div>
    <div class="sync-banner">🔄 Sincronizado con Firebase · conteo base 24-jul-2026</div>
    <div class="card"><div class="tbl-wrap"><table>
      <thead><tr><th>Producto</th><th>Stock</th><th>Mín</th><th>Precio</th><th>Estado</th><th></th></tr></thead>
      <tbody>${items.map(i=>{const bajo=i.stock<=i.minimo;return`<tr>
        <td><b>${esc(i.nombre)}</b><div style="font-size:10px;color:#6B7A99">${esc(i.unidad)}</div></td>
        <td><b style="color:${bajo?'#C1442D':'#1A2744'}">${fmtN(i.stock)}</b></td>
        <td>${fmtN(i.minimo)}</td>
        <td>${fmt(i.precio)}</td>
        <td>${badge(bajo?'⚠ Bajo':'OK',bajo?'#C1442D':'#2ECC8F')}</td>
        <td style="white-space:nowrap">
          <button class="btn btn-success btn-sm" onclick="openModalMovPT('${i.id}','E')">+</button>
          <button class="btn btn-danger btn-sm" onclick="openModalMovPT('${i.id}','S')" style="margin-left:3px">−</button>
        </td>
      </tr>`;}).join('')}</tbody>
    </table></div></div>
    ${movPT.length>0?`<div class="card"><h4>📋 Últimos movimientos PT</h4><div class="tbl-wrap"><table><thead><tr><th>Fecha</th><th>Producto</th><th>Tipo</th><th>Cant.</th><th>Nota</th></tr></thead><tbody>${movPT.slice(0,10).map(m=>`<tr><td>${m.fecha}</td><td>${esc(m.nombre)}</td><td>${badge(m.tipo==='entrada'?'Entrada':'Salida',m.tipo==='entrada'?'#2ECC8F':'#F5820D')}</td><td>${fmtN(m.cantidad)}</td><td style="font-size:11px;color:#6B7A99">${esc(m.nota)}</td></tr>`).join('')}</tbody></table></div></div>`:''}`;
}

function openModalMovPT(id, tipo) {
  const item=pt.find(i=>i.id===id);
  openModal(tipo==='E'?`📥 Entrada — ${item.nombre}`:`📤 Salida — ${item.nombre}`,`
    <p style="color:#6B7A99;font-size:13px;margin-bottom:12px">Stock actual: <b>${fmtN(item.stock)} ${esc(item.unidad)}</b></p>
    <div class="form-group"><label class="form-label">Cantidad</label><input class="form-input" id="mmpt-cant" type="number"></div>
    <div class="form-group"><label class="form-label">Nota</label><input class="form-input" id="mmpt-nota" placeholder="Motivo, cliente…"></div>
    <button class="btn btn-primary btn-full" onclick="confirmarMovPT('${id}','${tipo}')">✅ Confirmar</button>`);
}

async function confirmarMovPT(id, tipo) {
  const item=pt.find(i=>i.id===id);
  const cant=parseFloat(document.getElementById('mmpt-cant').value)||0;
  const nota=document.getElementById('mmpt-nota').value;
  if(!item||cant<=0){alert('Cantidad inválida');return;}
  const nuevoStock=Math.max(0,item.stock+(tipo==='E'?cant:-cant));
  pt=pt.map(i=>i.id===id?{...i,stock:nuevoStock}:i);
  const mov={fecha:today(),ptId:id,nombre:item.nombre,tipo:tipo==='E'?'entrada':'salida',cantidad:cant,nota};
  movPT.unshift(mov);
  await guardarStockPT(id,nuevoStock);
  await guardarMovPT(mov);
  closeModal();render();
}

    </table></div></div>
    <div class="card"><h4>👥 Clientes clave</h4>
      <div class="tbl-wrap"><table><thead><tr><th>Cliente</th><th>Zona</th><th>Notas</th></tr></thead><tbody>
        ${clientes.map(c=>`<tr><td><b>${esc(c.nombre)}</b></td><td style="font-size:11px">${esc(c.zona)}</td><td style="font-size:11px;color:${c.nota.includes('⚠')?'#F5820D':'#6B7A99'}">${esc(c.nota)}</td></tr>`).join('')}

// COBROS
// ═══════════════════════════════════════════════════════
function tabCobros() {
  const pend=pedidosFB.filter(p=>p.estado==='pendiente');
  const entregados=pedidosFB.filter(p=>p.estado==='entregado'||p.estado==='pagado');
  const xCob=pend.reduce((s,p)=>s+(p.total||0),0);
  const cob=entregados.reduce((s,p)=>s+(p.total||0),0);
  const porCli={};
  pend.forEach(p=>{if(!porCli[p.clienteNombre])porCli[p.clienteNombre]=0;porCli[p.clienteNombre]+=(p.total||0);});
  const cliOrden=Object.entries(porCli).sort((a,b)=>b[1]-a[1]);
  return `
    <div class="sync-banner">🔄 Cobros en tiempo real · app de pedidos</div>
    <div class="kpi-row">
      ${kpi('⏳',fmt(xCob),'Por cobrar','#F5820D',pend.length+' pedidos')}
      ${kpi('✅',fmt(cob),'Cobrado/Entregado','#2ECC8F',entregados.length+' pedidos')}
      ${kpi('👥',cliOrden.length,'Clientes con saldo',cliOrden.length?'#F5820D':'#2ECC8F')}
    </div>
    ${cliOrden.length?`<div class="card"><h4>📋 Saldo por Cliente</h4>
      ${cliOrden.map(([nombre,total])=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#FFF3E0;border-radius:9px;margin-bottom:7px">
        <div style="font-weight:700;font-size:13px">${esc(nombre)}</div>
        <span style="font-size:16px;font-weight:800;color:#F5820D">${fmt(total)}</span>
      </div>`).join('')}
    </div>`:''}
    <div class="card"><h4>⏳ Pedidos pendientes de cobro</h4>
      ${pend.length?pend.map(p=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #F0F2F7;font-size:12px">
        <div><b>${esc(p.clienteNombre)}</b><br><span style="color:#6B7A99">${p.fecha} · Folio ${p.folio}</span></div>
        <b style="color:#F5820D">${fmt(p.total)}</b>
      </div>`).join(''):'<p style="color:#6B7A99;font-size:13px">🎉 Sin cuentas pendientes</p>'}
    </div>`;
}
