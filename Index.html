<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>YGARMEX</title>
<style>
  :root {
    --verde: #1a6b3c; --verde-claro: #e8f5ee;
    --rojo: #c0392b; --rojo-claro: #fdecea;
    --amarillo: #f39c12; --gris: #f4f4f4;
    --gris-medio: #ddd; --texto: #1a1a1a;
    --texto-suave: #666; --blanco: #fff;
    --sombra: 0 2px 8px rgba(0,0,0,0.10); --radio: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--gris); color: var(--texto); min-height: 100vh; }

  /* PIN */
  #pinScreen { position: fixed; inset: 0; background: var(--verde); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; gap: 24px; }
  #pinScreen h1 { color: var(--blanco); font-size: 2rem; letter-spacing: 2px; font-weight: 800; }
  #pinDots { display: flex; gap: 14px; }
  .dot { width: 18px; height: 18px; border-radius: 50%; background: rgba(255,255,255,0.3); border: 2px solid rgba(255,255,255,0.6); transition: background 0.2s; }
  .dot.lleno { background: var(--blanco); }
  #pinError { color: #ff8a8a; font-size: 0.85rem; min-height: 20px; }
  #teclado { display: grid; grid-template-columns: repeat(3, 72px); gap: 12px; }
  .tecla { height: 72px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.4); background: rgba(255,255,255,0.1); color: var(--blanco); font-size: 1.5rem; font-weight: 600; cursor: pointer; transition: background 0.15s; }
  .tecla:active { background: rgba(255,255,255,0.35); }

  /* APP */
  #app { display: none; flex-direction: column; min-height: 100vh; }
  header { background: var(--verde); color: var(--blanco); padding: 14px 16px 12px; position: sticky; top: 0; z-index: 100; box-shadow: var(--sombra); }
  .header-row { display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: 1px; }
  #statusBadge { font-size: 0.7rem; padding: 3px 8px; border-radius: 20px; background: rgba(255,255,255,0.2); color: var(--blanco); }
  nav { display: flex; background: var(--blanco); border-bottom: 2px solid var(--gris-medio); position: sticky; top: 56px; z-index: 99; overflow-x: auto; }
  .tab { flex: 1; min-width: 70px; padding: 11px 6px; border: none; background: none; font-size: 0.72rem; font-weight: 600; color: var(--texto-suave); cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
  .tab.activo { color: var(--verde); border-bottom-color: var(--verde); }
  main { flex: 1; padding: 16px; max-width: 700px; margin: 0 auto; width: 100%; }
  .seccion { display: none; }
  .seccion.visible { display: block; }

  /* CARDS */
  .card { background: var(--blanco); border-radius: var(--radio); box-shadow: var(--sombra); padding: 14px 16px; margin-bottom: 12px; }
  .resumen-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .resumen-item { background: var(--blanco); border-radius: var(--radio); padding: 12px; box-shadow: var(--sombra); text-align: center; }
  .resumen-item .num { font-size: 1.4rem; font-weight: 800; color: var(--verde); line-height: 1; }
  .resumen-item .label { font-size: 0.65rem; color: var(--texto-suave); margin-top: 4px; }
  .resumen-item.alerta .num { color: var(--rojo); }

  /* ITEMS */
  .item-inv { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--gris); }
  .item-inv:last-child { border-bottom: none; }
  .inv-nombre { font-size: 0.88rem; font-weight: 600; }
  .inv-detalle { font-size: 0.72rem; color: var(--texto-suave); margin-top: 2px; }
  .inv-derecha { display: flex; align-items: center; gap: 10px; }
  .inv-stock { text-align: right; }
  .inv-stock .cantidad { font-size: 1.05rem; font-weight: 800; color: var(--verde); }
  .inv-stock .cantidad.bajo { color: var(--amarillo); }
  .inv-stock .cantidad.critico { color: var(--rojo); }
  .inv-stock small { font-size: 0.68rem; color: var(--texto-suave); }

  /* BTN + */
  .btn-mas { width: 34px; height: 34px; border-radius: 50%; background: var(--verde); color: var(--blanco); border: none; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .btn-menos { width: 34px; height: 34px; border-radius: 50%; background: var(--rojo); color: var(--blanco); border: none; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

  /* BUSCADOR */
  .buscador { width: 100%; padding: 10px 14px; border: 1.5px solid var(--gris-medio); border-radius: 10px; font-size: 0.9rem; margin-bottom: 14px; background: var(--blanco); color: var(--texto); }
  .buscador:focus { outline: none; border-color: var(--verde); }

  /* FILTROS */
  .filtros { display: flex; gap: 8px; margin-bottom: 14px; overflow-x: auto; padding-bottom: 4px; }
  .filtro-btn { flex-shrink: 0; padding: 6px 14px; border-radius: 20px; border: 1.5px solid var(--gris-medio); background: var(--blanco); font-size: 0.78rem; font-weight: 600; color: var(--texto-suave); cursor: pointer; }
  .filtro-btn.activo { background: var(--verde); color: var(--blanco); border-color: var(--verde); }

  /* MODAL */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: flex; align-items: flex-end; justify-content: center; }
  .modal-overlay.hidden { display: none; }
  .modal { background: var(--blanco); border-radius: 20px 20px 0 0; padding: 24px 20px 40px; width: 100%; max-width: 500px; }
  .modal h3 { font-size: 1.1rem; font-weight: 800; margin-bottom: 16px; color: var(--verde); }
  .modal-campo { margin-bottom: 14px; }
  .modal-campo label { display: block; font-size: 0.78rem; font-weight: 700; color: var(--texto-suave); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  .modal-campo input, .modal-campo select { width: 100%; padding: 12px 14px; border: 1.5px solid var(--gris-medio); border-radius: 10px; font-size: 0.95rem; background: var(--blanco); color: var(--texto); }
  .modal-campo input:focus, .modal-campo select:focus { outline: none; border-color: var(--verde); }
  .modal-tipo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .tipo-btn { padding: 12px; border-radius: 10px; border: 2px solid var(--gris-medio); background: var(--blanco); font-size: 0.85rem; font-weight: 700; cursor: pointer; text-align: center; }
  .tipo-btn.entrada.sel { background: var(--verde-claro); border-color: var(--verde); color: var(--verde); }
  .tipo-btn.salida.sel { background: var(--rojo-claro); border-color: var(--rojo); color: var(--rojo); }
  .btn-guardar { width: 100%; padding: 14px; background: var(--verde); color: var(--blanco); border: none; border-radius: 12px; font-size: 1rem; font-weight: 800; cursor: pointer; margin-top: 8px; }
  .btn-guardar:active { opacity: 0.85; }
  .btn-guardar.rojo { background: var(--rojo); }
  .btn-cancelar { width: 100%; padding: 12px; background: none; color: var(--texto-suave); border: none; font-size: 0.9rem; cursor: pointer; margin-top: 8px; }

  /* HISTORIAL */
  .hist-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--gris); font-size: 0.8rem; }
  .hist-item:last-child { border-bottom: none; }
  .hist-tipo { font-weight: 700; }
  .hist-tipo.entrada { color: var(--verde); }
  .hist-tipo.salida { color: var(--rojo); }
  .hist-tipo.produccion { color: var(--amarillo); }

  /* PEDIDOS / COBROS */
  .pedido-card { background: var(--blanco); border-radius: var(--radio); box-shadow: var(--sombra); padding: 14px 16px; margin-bottom: 10px; border-left: 4px solid var(--verde); }
  .pedido-card.pendiente { border-left-color: var(--amarillo); }
  .pedido-card.entregado { border-left-color: var(--gris-medio); opacity: 0.75; }
  .pedido-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
  .pedido-cliente { font-size: 0.92rem; font-weight: 700; }
  .pedido-monto { font-size: 0.92rem; font-weight: 800; color: var(--verde); }
  .pedido-fecha { font-size: 0.72rem; color: var(--texto-suave); }
  .pedido-productos { font-size: 0.78rem; color: var(--texto-suave); margin-top: 4px; }
  .badge { display: inline-block; font-size: 0.65rem; font-weight: 700; padding: 2px 8px; border-radius: 20px; margin-left: 4px; }
  .badge.nuevo { background: var(--verde-claro); color: var(--verde); }
  .badge.pendiente { background: #fff3cd; color: #856404; }
  .badge.entregado { background: var(--gris); color: var(--texto-suave); }
  .badge.alerta { background: var(--rojo-claro); color: var(--rojo); }

  /* COBROS */
  .res-cobro { background: var(--blanco); border-radius: 10px; padding: 12px; box-shadow: var(--sombra); text-align: center; }
  .res-cobro .num { font-size: 1rem; font-weight: 800; }
  .res-cobro .lbl { font-size: 0.65rem; color: var(--texto-suave); margin-top: 3px; }
  .res-cobro.pendiente .num { color: var(--rojo); }
  .res-cobro.cobrado .num { color: var(--verde); }
  .cobro-card { background: var(--blanco); border-radius: var(--radio); box-shadow: var(--sombra); padding: 14px 16px; margin-bottom: 10px; }
  .cobro-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .cobro-cliente { font-size: 0.9rem; font-weight: 700; }
  .cobro-total.pendiente { color: var(--rojo); font-weight: 800; }
  .cobro-total.pagado { color: var(--verde); font-weight: 800; }
  .cobro-detalle { font-size: 0.74rem; color: var(--texto-suave); margin-top: 2px; }
  .barra-cobro { height: 5px; background: var(--gris); border-radius: 3px; margin-top: 8px; }
  .barra-cobro-fill { height: 100%; background: var(--verde); border-radius: 3px; }

  /* TOAST */
  #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1a1a1a; color: #fff; padding: 12px 20px; border-radius: 10px; font-size: 0.85rem; font-weight: 600; z-index: 9000; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  #toast.show { opacity: 1; }

  .vacio { text-align: center; padding: 40px 20px; color: var(--texto-suave); }
  .vacio .icono { font-size: 2.5rem; margin-bottom: 10px; }
  .loader { text-align: center; padding: 30px; color: var(--texto-suave); font-size: 0.85rem; }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--gris-medio); border-top-color: var(--verde); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sep { font-size: 0.7rem; font-weight: 700; color: var(--texto-suave); text-transform: uppercase; letter-spacing: 1px; margin: 14px 0 8px; }
</style>
</head>

let fbConectado=false;
let modalMaterial=null, modalTipo='entrada', modalColeccion='stockMP';

// INIT
function iniciarApp(){
  renderMP(); renderPT();
  conectarFirebase();
}

async function conectarFirebase(){
  try {
    // Cargar MP
    const snapMP = await db.collection('stockMP').get();
    if(!snapMP.empty){
      const fbMP = snapMP.docs.map(d=>({...d.data(),id:d.id}));
      mp = MP_BASE.map(base=>{ const fb=fbMP.find(x=>x.id===base.id); return fb?{...base,...fb}:base; });
    } else {
      const batch=db.batch();
      MP_BASE.forEach(item=>batch.set(db.collection('stockMP').doc(item.id),item));
      await batch.commit();
    }
    // Cargar PT
    const snapPT = await db.collection('stockPT').get();
    if(!snapPT.empty){
      const fbPT = snapPT.docs.map(d=>({...d.data(),id:d.id}));
      pt = PT_BASE.map(base=>{ const fb=fbPT.find(x=>x.id===base.id); return fb?{...base,...fb}:base; });
    } else {
      const batch=db.batch();
      PT_BASE.forEach(item=>batch.set(db.collection('stockPT').doc(item.id),item));
      await batch.commit();
    }
    fbConectado=true;
    document.getElementById('statusBadge').textContent='🟢 En línea';
    renderMP(); renderPT();

    // Pedidos en tiempo real
    db.collection('pedidosYgarmex').onSnapshot(snap=>{
      pedidos=snap.docs.map(d=>({...d.data(),id:d.id}));
      pedidos.sort((a,b)=>((b.creadoEn||b.fecha||'')>(a.creadoEn||a.fecha||'')?1:-1));
      if(tabActivo==='pedidos') renderPedidos();
    });
    // Cobros en tiempo real
    db.collection('cobros_remisiones').onSnapshot(snap=>{
      cobros=snap.docs.map(d=>({...d.data(),id:d.id}));
      cobros.sort((a,b)=>((b.creadoEn||b.fecha||'')>(a.creadoEn||a.fecha||'')?1:-1));
      if(tabActivo==='cobros') renderCobros();
    });
  } catch(e){
    document.getElementById('statusBadge').textContent='🔴 Sin conexión';
    renderMP(); renderPT();
  }
}

// TABS
function irTab(t){
  tabActivo=t;
  document.querySelectorAll('.tab').forEach((b,i)=>{ b.classList.toggle('activo',['mp','pt','pedidos','cobros'][i]===t); });
  document.querySelectorAll('.seccion').forEach(s=>s.classList.remove('visible'));
  document.getElementById('tab-'+t).classList.add('visible');
  if(t==='pedidos') renderPedidos();
  if(t==='cobros') renderCobros();
}

// RENDER MP
function renderMP(){
  const busca=(document.getElementById('busca-mp')?.value||'').toLowerCase();
  const filtrado=mp.filter(x=>x.nombre.toLowerCase().includes(busca));
  const criticos=filtrado.filter(x=>x.cantidad<=x.critico).length;
  const alertas=filtrado.filter(x=>x.cantidad>x.critico&&x.cantidad<=x.alerta).length;
  document.getElementById('resumen-mp').innerHTML=`
    <div class="resumen-item"><div class="num">${filtrado.length}</div><div class="label">Materiales</div></div>
    <div class="resumen-item ${alertas>0?'alerta':''}"><div class="num">${alertas}</div><div class="label">En alerta</div></div>
    <div class="resumen-item ${criticos>0?'alerta':''}"><div class="num">${criticos}</div><div class="label">Criticos</div></div>`;
  if(!filtrado.length){ document.getElementById('lista-mp').innerHTML='<div class="vacio"><div class="icono">🔍</div><p>Sin resultados</p></div>'; return; }
  const html=filtrado.map(item=>{
    const cls=item.cantidad<=item.critico?'critico':item.cantidad<=item.alerta?'bajo':'';
    return `<div class="item-inv">
      <div><div class="inv-nombre">${item.nombre}</div><div class="inv-detalle">Alerta: ${item.alerta} | Critico: ${item.critico} ${item.unidad}</div></div>
      <div class="inv-derecha">
        <div class="inv-stock"><div class="cantidad ${cls}">${item.cantidad}</div><small>${item.unidad}</small></div>
        <button class="btn-mas" onclick="abrirModal('${item.id}','stockMP')">+</button>
      </div>
    </div>`;
  }).join('');
  document.getElementById('lista-mp').innerHTML=`<div class="card">${html}</div>`;
}

// RENDER PT
function renderPT(){
  const busca=(document.getElementById('busca-pt')?.value||'').toLowerCase();
  const filtrado=pt.filter(x=>x.nombre.toLowerCase().includes(busca));
  const conStock=filtrado.filter(x=>x.cantidad>0).length;
  document.getElementById('resumen-pt').innerHTML=`
    <div class="resumen-item"><div class="num">${conStock}</div><div class="label">Con stock</div></div>
    <div class="resumen-item"><div class="num">${filtrado.length-conStock}</div><div class="label">Agotados</div></div>
    <div class="resumen-item"><div class="num">${filtrado.length}</div><div class="label">Productos</div></div>`;
  if(!filtrado.length){ document.getElementById('lista-pt').innerHTML='<div class="vacio"><div class="icono">🔍</div><p>Sin resultados</p></div>'; return; }
  const html=filtrado.map(item=>{
    const cls=item.cantidad<=item.critico?'critico':item.cantidad<=item.alerta?'bajo':'';
    return `<div class="item-inv">
      <div><div class="inv-nombre">${item.nombre}</div></div>
      <div class="inv-derecha">
        <div class="inv-stock"><div class="cantidad ${cls}">${item.cantidad}</div><small>${item.unidad}</small></div>
        <button class="btn-mas" onclick="abrirModal('${item.id}','stockPT')">+</button>
      </div>
    </div>`;
  }).join('');
  document.getElementById('lista-pt').innerHTML=`<div class="card">${html}</div>`;
}

// MODAL
async function abrirModal(id, coleccion){
  const lista = coleccion==='stockMP' ? mp : pt;
  modalMaterial = lista.find(x=>x.id===id);
  modalColeccion = coleccion;
  modalTipo = 'entrada';
  if(!modalMaterial) return;
  document.getElementById('modalTitulo').textContent = modalMaterial.nombre;
  document.getElementById('modalCantidad').value = '';
  document.getElementById('modalNota').value = '';
  document.getElementById('btnEntrada').classList.add('sel');
  document.getElementById('btnSalida').classList.remove('sel');
  document.getElementById('btnGuardar').className = 'btn-guardar';
  document.getElementById('modalOverlay').classList.remove('hidden');
  // Cargar historial
  await cargarHistorial(id, coleccion);
}

async function cargarHistorial(id, coleccion){
  const histCol = coleccion==='stockMP' ? 'historialMP' : 'historialPT';
  const el = document.getElementById('modalHistorial');
  el.innerHTML = '<div style="font-size:0.8rem;color:var(--texto-suave)">Cargando...</div>';
  try {
    const snap = await db.collection(histCol).where('materialId','==',id).get();
    if(snap.empty){ el.innerHTML='<div style="font-size:0.8rem;color:var(--texto-suave);padding:8px 0">Sin movimientos registrados</div>'; return; }
    const items = snap.docs.map(d=>d.data()).sort((a,b)=>((b.fecha||'')>(a.fecha||'')?1:-1)).slice(0,5);
    el.innerHTML = items.map(m=>`
      <div class="hist-item">
        <span class="hist-tipo ${m.tipo}">${m.tipo==='entrada'?'📥':m.tipo==='salida'?'📤':'⚙️'} ${m.tipo}</span>
        <span style="font-weight:700">${m.tipo==='salida'?'-':'+'} ${m.cantidad} ${m.unidad||''}</span>
      </div>
      <div style="font-size:0.72rem;color:var(--texto-suave);padding:0 0 4px">${m.nota||''} · ${(m.fecha||'').substring(0,10)}</div>
    `).join('');
  } catch(e){ el.innerHTML=''; }
}

function selTipo(t){
  modalTipo=t;
  document.getElementById('btnEntrada').classList.toggle('sel',t==='entrada');
  document.getElementById('btnSalida').classList.toggle('sel',t==='salida');
  document.getElementById('btnGuardar').className='btn-guardar'+(t==='salida'?' rojo':'');
}

function cerrarModal(e){
  if(e && e.target!==document.getElementById('modalOverlay')) return;
  document.getElementById('modalOverlay').classList.add('hidden');
}

async function guardarMovimiento(){
  const cant = parseFloat(document.getElementById('modalCantidad').value);
  const nota = document.getElementById('modalNota').value.trim();
  if(!cant || cant<=0){ toast('Ingresa una cantidad válida'); return; }
  if(!modalMaterial){ return; }

  const btn = document.getElementById('btnGuardar');
  btn.textContent='Guardando…'; btn.disabled=true;

  try {
    // Calcular nuevo stock
    const stockActual = modalMaterial.cantidad || 0;
    const nuevoStock = modalTipo==='entrada' ? stockActual + cant : stockActual - cant;
    if(nuevoStock < 0){ toast('⚠️ Stock insuficiente'); btn.textContent='Guardar'; btn.disabled=false; return; }

    const fecha = new Date().toISOString();
    const histCol = modalColeccion==='stockMP' ? 'historialMP' : 'historialPT';

    // Guardar historial
    await db.collection(histCol).add({
      materialId: modalMaterial.id,
      nombre: modalMaterial.nombre,
      tipo: modalTipo,
      cantidad: cant,
      unidad: modalMaterial.unidad,
      nota: nota,
      fecha: fecha,
      stockAntes: stockActual,
      stockDespues: nuevoStock,
    });

    // Actualizar stock
    await db.collection(modalColeccion).doc(modalMaterial.id).set({
      ...modalMaterial,
      cantidad: nuevoStock,
      ultimoMovimiento: fecha,
    });

    // Actualizar local
    const lista = modalColeccion==='stockMP' ? mp : pt;
    const idx = lista.findIndex(x=>x.id===modalMaterial.id);
    if(idx>=0) lista[idx].cantidad = nuevoStock;
    modalMaterial.cantidad = nuevoStock;

    toast(`✅ ${modalTipo==='entrada'?'Entrada':'Salida'} de ${cant} ${modalMaterial.unidad} registrada`);
    document.getElementById('modalOverlay').classList.add('hidden');

    if(modalColeccion==='stockMP') renderMP();
    else renderPT();

  } catch(e){
    toast('❌ Error al guardar. Intenta de nuevo.');
    console.error(e);
  }
  btn.textContent='Guardar'; btn.disabled=false;
}

// PEDIDOS
function renderPedidos(){
  let lista=[...pedidos];
  if(filtroPed!=='todos') lista=lista.filter(p=>(p.estado||'nuevo')===filtroPed);
  if(!lista.length){ document.getElementById('lista-pedidos').innerHTML='<div class="vacio"><div class="icono">📋</div><p>'+(fbConectado?'Sin pedidos en esta categoría':'Conectando...')+'</p></div>'; return; }
  const html=lista.map(p=>{
    const estado=p.estado||'nuevo';
    const monto=p.total||p.monto||0;
    const fecha=fmtFecha(p.creadoEn||p.fecha);
    const prods=p.productos?p.productos.map(pr=>`${pr.nombre||pr.producto} × ${pr.cantidad||pr.bultos}`).join(', '):(p.descripcion||'');
    const cn=(p.clienteNombre||'').toLowerCase();
    let alertaF='';
    if(cn.includes('audelo')) alertaF='<span class="badge alerta">DELIAMAITE</span>';
    else if(cn.includes('god')) alertaF='<span class="badge alerta">Patricia Flores</span>';
    else if(cn.includes('armando')||cn.includes('frijolero')) alertaF='<span class="badge alerta">RIASSA</span>';
    return `<div class="pedido-card ${estado}">
      <div class="pedido-header"><div><span class="pedido-cliente">${p.clienteNombre||p.cliente||'—'}</span><span class="badge ${estado}">${estado}</span>${alertaF}</div><div class="pedido-monto">${fmt(monto)}</div></div>
      <div class="pedido-fecha">${fecha}</div>
      ${prods?`<div class="pedido-productos">${prods}</div>`:''}
    </div>`;
  }).join('');
  document.getElementById('lista-pedidos').innerHTML=html;
}
function setFiltroPed(f,btn){ filtroPed=f; document.querySelectorAll('#tab-pedidos .filtro-btn').forEach(b=>b.classList.remove('activo')); btn.classList.add('activo'); renderPedidos(); }

// COBROS
function renderCobros(){
  const hoy=new Date();
  let lista=cobros.map(c=>{
    const fechaDoc=new Date(c.fecha||c.creadoEn||hoy);
    const dias=Math.floor((hoy-fechaDoc)/86400000);
    const cobrado=(c.pagos||[]).reduce((s,p)=>s+(p.monto||0),0);
    const saldo=(c.monto||0)-cobrado;
    return {...c,dias,cobrado,saldo,vencido:dias>15&&saldo>0};
  });
  if(filtroCob==='pendiente') lista=lista.filter(c=>c.saldo>0&&!c.vencido);
  if(filtroCob==='pagado') lista=lista.filter(c=>c.saldo<=0);
  if(filtroCob==='vencido') lista=lista.filter(c=>c.vencido);
  const totalCart=cobros.reduce((s,c)=>s+(c.monto||0),0);
  const totalCob=cobros.reduce((s,c)=>s+(c.pagos||[]).reduce((x,p)=>x+(p.monto||0),0),0);
  document.getElementById('resumen-cobros').innerHTML=`
    <div class="res-cobro"><div class="num">${fmtK(totalCart)}</div><div class="lbl">Cartera</div></div>
    <div class="res-cobro pendiente"><div class="num">${fmtK(totalCart-totalCob)}</div><div class="lbl">Pendiente</div></div>
    <div class="res-cobro cobrado"><div class="num">${fmtK(totalCob)}</div><div class="lbl">Cobrado</div></div>`;
  if(!lista.length){ document.getElementById('lista-cobros').innerHTML='<div class="vacio"><div class="icono">💰</div><p>Sin registros</p></div>'; return; }
  document.getElementById('lista-cobros').innerHTML=lista.map(c=>{
    const pct=c.monto>0?Math.min(100,Math.round(c.cobrado/c.monto*100)):0;
    return `<div class="cobro-card">
      <div class="cobro-header"><div class="cobro-cliente">${c.clienteNombre||c.cliente||'—'}${c.vencido?'<span class="badge alerta">Vencido</span>':''}</div>
      <div class="cobro-total ${c.saldo<=0?'pagado':'pendiente'}">${fmt(c.saldo>0?c.saldo:c.monto)}</div></div>
      <div class="cobro-detalle">${c.fecha||''} · ${c.dias} días · Rem: ${c.remision||'—'}</div>
      <div class="barra-cobro"><div class="barra-cobro-fill" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');
}
function setFiltroCob(f,btn){ filtroCob=f; document.querySelectorAll('#tab-cobros .filtro-btn').forEach(b=>b.classList.remove('activo')); btn.classList.add('activo'); renderCobros(); }

// UTILS
function fmt(n){ return '$'+Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:0,maximumFractionDigits:0}); }
function fmtK(n){ return n>=1000?'$'+(n/1000).toFixed(1)+'k':fmt(n); }
function fmtFecha(f){ if(!f)return''; try{ return new Date(f).toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'}); }catch{return f;} }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500); }
</script>
