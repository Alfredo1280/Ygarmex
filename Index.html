<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>YGARMEX</title>
<style>
  :root {
    --verde: #1a6b3c;
    --verde-claro: #e8f5ee;
    --rojo: #c0392b;
    --rojo-claro: #fdecea;
    --amarillo: #f39c12;
    --gris: #f4f4f4;
    --gris-medio: #ddd;
    --texto: #1a1a1a;
    --texto-suave: #666;
    --blanco: #fff;
    --sombra: 0 2px 8px rgba(0,0,0,0.10);
    --radio: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--gris); color: var(--texto); min-height: 100vh; }

  /* PIN */
  #pinScreen {
    position: fixed; inset: 0; background: var(--verde);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 9999; gap: 24px;
  }
  #pinScreen h1 { color: var(--blanco); font-size: 2rem; letter-spacing: 2px; font-weight: 800; }
  #pinScreen p { color: rgba(255,255,255,0.7); font-size: 0.9rem; }
  #pinDots { display: flex; gap: 14px; }
  .dot { width: 18px; height: 18px; border-radius: 50%; background: rgba(255,255,255,0.3); border: 2px solid rgba(255,255,255,0.6); transition: background 0.2s; }
  .dot.lleno { background: var(--blanco); }
  #pinError { color: #ff8a8a; font-size: 0.85rem; min-height: 20px; }
  #teclado { display: grid; grid-template-columns: repeat(3, 72px); gap: 12px; }
  .tecla {
    height: 72px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.4);
    background: rgba(255,255,255,0.1); color: var(--blanco); font-size: 1.5rem; font-weight: 600;
    cursor: pointer; transition: background 0.15s;
  }
  .tecla:active { background: rgba(255,255,255,0.35); }
  .tecla.borra { font-size: 1.1rem; }

  /* APP */
  #app { display: none; flex-direction: column; min-height: 100vh; }

  /* HEADER */
  header {
    background: var(--verde); color: var(--blanco); padding: 14px 16px 12px;
    position: sticky; top: 0; z-index: 100; box-shadow: var(--sombra);
  }
  .header-row { display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: 1px; }
  #statusBadge {
    font-size: 0.7rem; padding: 3px 8px; border-radius: 20px;
    background: rgba(255,255,255,0.2); color: var(--blanco);
  }

  /* TABS */
  nav {
    display: flex; background: var(--blanco); border-bottom: 2px solid var(--gris-medio);
    position: sticky; top: 56px; z-index: 99; overflow-x: auto;
  }
  .tab {
    flex: 1; min-width: 80px; padding: 12px 8px; border: none; background: none;
    font-size: 0.78rem; font-weight: 600; color: var(--texto-suave); cursor: pointer;
    border-bottom: 3px solid transparent; transition: all 0.2s; white-space: nowrap;
  }
  .tab.activo { color: var(--verde); border-bottom-color: var(--verde); }

  /* CONTENIDO */
  main { flex: 1; padding: 16px; max-width: 700px; margin: 0 auto; width: 100%; }

  .seccion { display: none; }
  .seccion.visible { display: block; }

  /* CARDS */
  .card {
    background: var(--blanco); border-radius: var(--radio); box-shadow: var(--sombra);
    padding: 14px 16px; margin-bottom: 12px;
  }
  .card-titulo { font-size: 0.7rem; font-weight: 700; color: var(--texto-suave); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }

  /* RESUMEN */
  .resumen-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .resumen-item {
    background: var(--blanco); border-radius: var(--radio); padding: 14px;
    box-shadow: var(--sombra); text-align: center;
  }
  .resumen-item .num { font-size: 1.6rem; font-weight: 800; color: var(--verde); line-height: 1; }
  .resumen-item .label { font-size: 0.7rem; color: var(--texto-suave); margin-top: 4px; }
  .resumen-item.alerta .num { color: var(--rojo); }

  /* TABLA MP/PT */
  .item-inv {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 0; border-bottom: 1px solid var(--gris);
  }
  .item-inv:last-child { border-bottom: none; }
  .inv-nombre { font-size: 0.9rem; font-weight: 600; }
  .inv-detalle { font-size: 0.75rem; color: var(--texto-suave); margin-top: 2px; }
  .inv-stock { text-align: right; }
  .inv-stock .cantidad { font-size: 1.1rem; font-weight: 800; color: var(--verde); }
  .inv-stock .cantidad.bajo { color: var(--amarillo); }
  .inv-stock .cantidad.critico { color: var(--rojo); }
  .inv-stock small { font-size: 0.7rem; color: var(--texto-suave); }

  /* PEDIDOS */
  .pedido-card {
    background: var(--blanco); border-radius: var(--radio); box-shadow: var(--sombra);
    padding: 14px 16px; margin-bottom: 10px; border-left: 4px solid var(--verde);
  }
  .pedido-card.pendiente { border-left-color: var(--amarillo); }
  .pedido-card.entregado { border-left-color: var(--gris-medio); opacity: 0.75; }
  .pedido-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
  .pedido-cliente { font-size: 0.95rem; font-weight: 700; }
  .pedido-monto { font-size: 0.95rem; font-weight: 800; color: var(--verde); }
  .pedido-fecha { font-size: 0.72rem; color: var(--texto-suave); }
  .pedido-productos { font-size: 0.78rem; color: var(--texto-suave); margin-top: 4px; line-height: 1.5; }
  .badge {
    display: inline-block; font-size: 0.65rem; font-weight: 700; padding: 2px 8px;
    border-radius: 20px; margin-left: 6px;
  }
  .badge.nuevo { background: var(--verde-claro); color: var(--verde); }
  .badge.pendiente { background: #fff3cd; color: #856404; }
  .badge.entregado { background: var(--gris); color: var(--texto-suave); }
  .badge.alerta { background: var(--rojo-claro); color: var(--rojo); }

  /* COBROS */
  .cobro-card {
    background: var(--blanco); border-radius: var(--radio); box-shadow: var(--sombra);
    padding: 14px 16px; margin-bottom: 10px;
  }
  .cobro-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .cobro-cliente { font-size: 0.92rem; font-weight: 700; }
  .cobro-total { font-size: 1rem; font-weight: 800; }
  .cobro-total.pendiente { color: var(--rojo); }
  .cobro-total.pagado { color: var(--verde); }
  .cobro-detalle { font-size: 0.75rem; color: var(--texto-suave); margin-top: 2px; }
  .barra-cobro { height: 5px; background: var(--gris); border-radius: 3px; margin-top: 8px; }
  .barra-cobro-fill { height: 100%; background: var(--verde); border-radius: 3px; transition: width 0.4s; }

  /* VACÍO */
  .vacio { text-align: center; padding: 40px 20px; color: var(--texto-suave); }
  .vacio .icono { font-size: 2.5rem; margin-bottom: 10px; }
  .vacio p { font-size: 0.85rem; }

  /* BUSCADOR */
  .buscador {
    width: 100%; padding: 10px 14px; border: 1.5px solid var(--gris-medio);
    border-radius: 10px; font-size: 0.9rem; margin-bottom: 14px;
    background: var(--blanco); color: var(--texto);
  }
  .buscador:focus { outline: none; border-color: var(--verde); }

  /* FILTROS */
  .filtros { display: flex; gap: 8px; margin-bottom: 14px; overflow-x: auto; padding-bottom: 4px; }
  .filtro-btn {
    flex-shrink: 0; padding: 6px 14px; border-radius: 20px; border: 1.5px solid var(--gris-medio);
    background: var(--blanco); font-size: 0.78rem; font-weight: 600; color: var(--texto-suave); cursor: pointer;
  }
  .filtro-btn.activo { background: var(--verde); color: var(--blanco); border-color: var(--verde); }

  /* LOADER */
  .loader { text-align: center; padding: 30px; color: var(--texto-suave); font-size: 0.85rem; }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--gris-medio); border-top-color: var(--verde); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* RESUMEN COBROS */
  .resumen-cobros { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .res-cobro { background: var(--blanco); border-radius: 10px; padding: 12px; box-shadow: var(--sombra); text-align: center; }
  .res-cobro .num { font-size: 1.1rem; font-weight: 800; }
  .res-cobro .lbl { font-size: 0.65rem; color: var(--texto-suave); margin-top: 3px; }
  .res-cobro.pendiente .num { color: var(--rojo); }
  .res-cobro.cobrado .num { color: var(--verde); }

  /* SEPARADOR */
  .sep { font-size: 0.7rem; font-weight: 700; color: var(--texto-suave); text-transform: uppercase; letter-spacing: 1px; margin: 14px 0 8px; }

  /* ACTUALIZAR BTN */
  .btn-actualizar {
    display: flex; align-items: center; gap: 6px; padding: 8px 14px;
    background: var(--verde-claro); color: var(--verde); border: none; border-radius: 8px;
    font-size: 0.8rem; font-weight: 700; cursor: pointer; margin-bottom: 14px;
  }
</style>
</head>

<script>
// ===== CONFIG FIREBASE =====
const FB_CONFIG = {
  apiKey: "AIzaSyAXso4z0NLz9v7yWPevvb9z0GcdJ1prOiI",
  authDomain: "app-pedidos-28256.firebaseapp.com",
  projectId: "app-pedidos-28256",
  storageBucket: "app-pedidos-28256.appspot.com",
  messagingSenderId: "444393536799",
  appId: "1:444393536799:web:b8d3f2a9c1e4d5f76cc460"
};

firebase.initializeApp(FB_CONFIG);
const db = firebase.firestore();

// ===== PIN =====
const PIN = '1280';
let pinActual = '';

function tecla(n) {
  if (pinActual.length >= 4) return;
  pinActual += n;
  actualizarDots();
  if (pinActual.length === 4) verificarPin();
}
function borrar() {
  pinActual = pinActual.slice(0,-1);
  actualizarDots();
  document.getElementById('pinError').textContent = '';
}
function actualizarDots() {
  for (let i=0; i<4; i++) {
    document.getElementById('d'+i).classList.toggle('lleno', i < pinActual.length);
  }
}
function verificarPin() {
  if (pinActual === PIN) {
    document.getElementById('pinScreen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    iniciarApp();
  } else {
    document.getElementById('pinError').textContent = 'PIN incorrecto';
    pinActual = '';
    actualizarDots();
  }
}

// ===== DATOS BASE MP (conteo Omar 24-jul-2026) =====
const MP_BASE = [
  {id:'sal',nombre:'Sal Cisne',cantidad:28,unidad:'bultos',alerta:10,critico:5,bultoKg:25},
  {id:'azucar_std',nombre:'Azúcar Estándar',cantidad:12,unidad:'bultos',alerta:5,critico:2,bultoKg:25},
  {id:'azucar_ref',nombre:'Azúcar Refinada',cantidad:8,unidad:'bultos',alerta:4,critico:2,bultoKg:25},
  {id:'fecula',nombre:'Fécula',cantidad:15,unidad:'bultos',alerta:6,critico:3,bultoKg:25},
  {id:'grenetina',nombre:'Grenetina',cantidad:10,unidad:'kg',alerta:20,critico:8,bultoKg:1},
  {id:'acido_citrico',nombre:'Ácido Cítrico',cantidad:5,unidad:'bultos',alerta:3,critico:1,bultoKg:25},
  {id:'glutamato',nombre:'Glutamato Ajinomoto',cantidad:3,unidad:'bultos',alerta:2,critico:1,bultoKg:22.7},
  {id:'carragenina',nombre:'Carragenina FH5',cantidad:8,unidad:'kg',alerta:10,critico:3,bultoKg:1},
  {id:'vainillina',nombre:'Vainillina',cantidad:2,unidad:'kg',alerta:3,critico:1,bultoKg:1},
  {id:'alcohol',nombre:'Alcohol 96°',cantidad:20,unidad:'litros',alerta:15,critico:5,bultoKg:1},
  {id:'curcuma',nombre:'Cúrcuma',cantidad:1,unidad:'kg',alerta:2,critico:0.5,bultoKg:1},
  {id:'papaina',nombre:'Papaína',cantidad:2,unidad:'kg',alerta:3,critico:1,bultoKg:1},
  {id:'color_chocolate',nombre:'Color Chocolate',cantidad:3,unidad:'kg',alerta:3,critico:1,bultoKg:1},
  {id:'ajo',nombre:'Ajo',cantidad:5,unidad:'kg',alerta:5,critico:2,bultoKg:1},
  {id:'cilantro',nombre:'Cilantro',cantidad:2,unidad:'bultos',alerta:2,critico:1,bultoKg:15},
  {id:'harina',nombre:'Harina',cantidad:10,unidad:'bultos',alerta:4,critico:2,bultoKg:25},
  {id:'bolsas',nombre:'Bolsa Plástico 18x25',cantidad:30,unidad:'kg',alerta:15,critico:5,bultoKg:1},
  {id:'costales_25',nombre:'Costales 25kg',cantidad:200,unidad:'pzas',alerta:100,critico:30,bultoKg:1},
  {id:'sabor_carne',nombre:'Sabor Carne McCormick',cantidad:4,unidad:'kg',alerta:3,critico:1,bultoKg:1},
];

// ===== DATOS BASE PT =====
const PT_BASE = [
  {id:'consome_m',nombre:'Consomé M',cantidad:0,unidad:'bultos',alerta:5,critico:2,bultoKg:25},
  {id:'consome_01',nombre:'Consomé 01',cantidad:0,unidad:'bultos',alerta:3,critico:1,bultoKg:25},
  {id:'consome_res',nombre:'Consomé Res',cantidad:0,unidad:'bultos',alerta:3,critico:1,bultoKg:25},
  {id:'consome_extra',nombre:'Consomé Extra',cantidad:0,unidad:'bultos',alerta:3,critico:1,bultoKg:25},
  {id:'gelatina_limon',nombre:'Gelatina Limón',cantidad:0,unidad:'bolsas',alerta:50,critico:20,bultoKg:1},
  {id:'gelatina_uva',nombre:'Gelatina Uva',cantidad:0,unidad:'bolsas',alerta:50,critico:20,bultoKg:1},
  {id:'gelatina_fresa',nombre:'Gelatina Fresa',cantidad:0,unidad:'bolsas',alerta:50,critico:20,bultoKg:1},
  {id:'gelatina_naranja',nombre:'Gelatina Naranja',cantidad:0,unidad:'bolsas',alerta:50,critico:20,bultoKg:1},
  {id:'flan_v',nombre:'Flan V (kileado)',cantidad:0,unidad:'bultos',alerta:5,critico:2,bultoKg:25},
  {id:'vainilla_4g',nombre:'Vainilla 4x4 Galón',cantidad:0,unidad:'cajas',alerta:3,critico:1,bultoKg:17},
  {id:'vainilla_1l',nombre:'Vainilla 1 Litro',cantidad:0,unidad:'cajas',alerta:3,critico:1,bultoKg:16.5},
  {id:'vainilla_medio',nombre:'Vainilla ½ Litro',cantidad:0,unidad:'cajas',alerta:3,critico:1,bultoKg:18},
  {id:'vainilla_cuarto',nombre:'Vainilla ¼ Litro',cantidad:0,unidad:'cajas',alerta:3,critico:1,bultoKg:14},
];

// ===== ESTADO =====
let mp = [...MP_BASE];
let pt = [...PT_BASE];
let pedidos = [];
let cobros = [];
let filtroPed = 'todos';
let filtroCob = 'todos';
let tabActivo = 'mp';
let fbConectado = false;

// ===== INICIAR APP =====
function iniciarApp() {
  // Renderizar inmediatamente con datos base
  renderMP();
  renderPT();
  // Luego conectar Firebase en background
  conectarFirebase();
}

async function conectarFirebase() {
  try {
    // MP
    const snapMP = await db.collection('stockMP').get();
    if (!snapMP.empty) {
      const fbMP = snapMP.docs.map(d => ({...d.data(), id: d.id}));
      mp = MP_BASE.map(base => {
        const fb = fbMP.find(x => x.id === base.id);
        return fb ? {...base, ...fb} : base;
      });
    } else {
      // Primera vez: subir datos base en batch
      const batch = db.batch();
      MP_BASE.forEach(item => batch.set(db.collection('stockMP').doc(item.id), item));
      await batch.commit();
    }

    // PT
    const snapPT = await db.collection('stockPT').get();
    if (!snapPT.empty) {
      const fbPT = snapPT.docs.map(d => ({...d.data(), id: d.id}));
      pt = PT_BASE.map(base => {
        const fb = fbPT.find(x => x.id === base.id);
        return fb ? {...base, ...fb} : base;
      });
    } else {
      const batch = db.batch();
      PT_BASE.forEach(item => batch.set(db.collection('stockPT').doc(item.id), item));
      await batch.commit();
    }

    fbConectado = true;
    document.getElementById('statusBadge').textContent = '🟢 En línea';
    renderMP();
    renderPT();

    // Escuchar pedidos en tiempo real (SIN orderBy para evitar error de índice)
    db.collection('pedidosYgarmex').onSnapshot(snap => {
      pedidos = snap.docs.map(d => ({...d.data(), id: d.id}));
      // Ordenar localmente por fecha desc
      pedidos.sort((a,b) => {
        const fa = a.creadoEn || a.fecha || '';
        const fb2 = b.creadoEn || b.fecha || '';
        return fb2 > fa ? 1 : -1;
      });
      if (tabActivo === 'pedidos') renderPedidos();
    }, err => {
      console.warn('Error pedidos:', err);
    });

    // Escuchar cobros en tiempo real (SIN orderBy)
    db.collection('cobros_remisiones').onSnapshot(snap => {
      cobros = snap.docs.map(d => ({...d.data(), id: d.id}));
      cobros.sort((a,b) => {
        const fa = a.creadoEn || a.fecha || '';
        const fb2 = b.creadoEn || b.fecha || '';
        return fb2 > fa ? 1 : -1;
      });
      if (tabActivo === 'cobros') renderCobros();
    }, err => {
      console.warn('Error cobros:', err);
    });

  } catch(e) {
    console.warn('Firebase no disponible:', e);
    document.getElementById('statusBadge').textContent = '🔴 Sin conexión';
    renderMP();
    renderPT();
  }
}

// ===== TABS =====
function irTab(t) {
  tabActivo = t;
  document.querySelectorAll('.tab').forEach((b,i) => {
    const tabs = ['mp','pt','pedidos','cobros'];
    b.classList.toggle('activo', tabs[i] === t);
  });
  document.querySelectorAll('.seccion').forEach(s => s.classList.remove('visible'));
  document.getElementById('tab-'+t).classList.add('visible');

  if (t === 'pedidos') renderPedidos();
  if (t === 'cobros') renderCobros();
}

// ===== RENDER MP =====
function renderMP() {
  const busca = (document.getElementById('busca-mp')?.value || '').toLowerCase();
  const filtrado = mp.filter(x => x.nombre.toLowerCase().includes(busca));
  const criticos = filtrado.filter(x => x.cantidad <= x.critico).length;
  const alertas = filtrado.filter(x => x.cantidad > x.critico && x.cantidad <= x.alerta).length;

  document.getElementById('resumen-mp').innerHTML = `
    <div class="resumen-item">
      <div class="num">${filtrado.length}</div>
      <div class="label">Materiales</div>
    </div>
    <div class="resumen-item ${criticos > 0 ? 'alerta' : ''}">
      <div class="num">${criticos}</div>
      <div class="label">Críticos</div>
    </div>
  `;

  if (filtrado.length === 0) {
    document.getElementById('lista-mp').innerHTML = '<div class="vacio"><div class="icono">🔍</div><p>Sin resultados</p></div>';
    return;
  }

  const html = filtrado.map(item => {
    const cls = item.cantidad <= item.critico ? 'critico' : item.cantidad <= item.alerta ? 'bajo' : '';
    return `<div class="item-inv">
      <div>
        <div class="inv-nombre">${item.nombre}</div>
        <div class="inv-detalle">Alerta: ${item.alerta} | Crítico: ${item.critico} ${item.unidad}</div>
      </div>
      <div class="inv-stock">
        <div class="cantidad ${cls}">${item.cantidad}</div>
        <small>${item.unidad}</small>
      </div>
    </div>`;
  }).join('');

  document.getElementById('lista-mp').innerHTML = `<div class="card">${html}</div>`;
}

// ===== RENDER PT =====
function renderPT() {
  const busca = (document.getElementById('busca-pt')?.value || '').toLowerCase();
  const filtrado = pt.filter(x => x.nombre.toLowerCase().includes(busca));
  const conStock = filtrado.filter(x => x.cantidad > 0).length;

  document.getElementById('resumen-pt').innerHTML = `
    <div class="resumen-item">
      <div class="num">${conStock}</div>
      <div class="label">Con stock</div>
    </div>
    <div class="resumen-item">
      <div class="num">${filtrado.length - conStock}</div>
      <div class="label">Agotados</div>
    </div>
  `;

  if (filtrado.length === 0) {
    document.getElementById('lista-pt').innerHTML = '<div class="vacio"><div class="icono">🔍</div><p>Sin resultados</p></div>';
    return;
  }

  const html = filtrado.map(item => {
    const cls = item.cantidad <= item.critico ? 'critico' : item.cantidad <= item.alerta ? 'bajo' : '';
    return `<div class="item-inv">
      <div>
        <div class="inv-nombre">${item.nombre}</div>
        <div class="inv-detalle">${item.bultoKg && item.bultoKg > 1 ? item.bultoKg+'kg/bulto' : ''}</div>
      </div>
      <div class="inv-stock">
        <div class="cantidad ${cls}">${item.cantidad}</div>
        <small>${item.unidad}</small>
      </div>
    </div>`;
  }).join('');

  document.getElementById('lista-pt').innerHTML = `<div class="card">${html}</div>`;
}

// ===== RENDER PEDIDOS =====
function renderPedidos() {
  let lista = [...pedidos];
  if (filtroPed !== 'todos') lista = lista.filter(p => (p.estado || 'nuevo') === filtroPed);

  if (lista.length === 0) {
    document.getElementById('lista-pedidos').innerHTML =
      '<div class="vacio"><div class="icono">📋</div><p>' +
      (fbConectado ? 'No hay pedidos en esta categoría' : 'Conectando a Firebase…') +
      '</p></div>';
    return;
  }

  const html = lista.map(p => {
    const estado = p.estado || 'nuevo';
    const monto = p.total || p.monto || 0;
    const fecha = formatFecha(p.creadoEn || p.fecha);
    const productos = p.productos ? p.productos.map(pr =>
      `${pr.nombre || pr.producto} × ${pr.cantidad || pr.bultos}`
    ).join(', ') : (p.descripcion || '');

    // Alertas de facturación especial
    let alertaFiscal = '';
    const cn = (p.clienteNombre || '').toLowerCase();
    if (cn.includes('audelo')) alertaFiscal = '<span class="badge alerta">DELIAMAITE</span>';
    else if (cn.includes('godínez') || cn.includes('godinez')) alertaFiscal = '<span class="badge alerta">Patricia Flores</span>';
    else if (cn.includes('armando') || cn.includes('frijolero')) alertaFiscal = '<span class="badge alerta">RIASSA</span>';
    else if (cn.includes('omar pérez') || cn.includes('omar perez')) alertaFiscal = '<span class="badge alerta">Idalia G.</span>';

    return `<div class="pedido-card ${estado}">
      <div class="pedido-header">
        <div>
          <span class="pedido-cliente">${p.clienteNombre || p.cliente || 'Sin nombre'}</span>
          <span class="badge ${estado}">${estado}</span>
          ${alertaFiscal}
        </div>
        <div class="pedido-monto">${fmt(monto)}</div>
      </div>
      <div class="pedido-fecha">${fecha}</div>
      ${productos ? `<div class="pedido-productos">${productos}</div>` : ''}
    </div>`;
  }).join('');

  document.getElementById('lista-pedidos').innerHTML = html;
}

function setFiltroPed(f, btn) {
  filtroPed = f;
  document.querySelectorAll('#tab-pedidos .filtro-btn').forEach(b => b.classList.remove('activo'));
  btn.classList.add('activo');
  renderPedidos();
}

// ===== RENDER COBROS =====
function renderCobros() {
  const hoy = new Date();
  let lista = cobros.map(c => {
    const fechaDoc = new Date(c.fecha || c.creadoEn || hoy);
    const dias = Math.floor((hoy - fechaDoc) / 86400000);
    const cobrado = (c.pagos || []).reduce((s,p) => s + (p.monto || 0), 0);
    const saldo = (c.monto || 0) - cobrado;
    const vencido = dias > 15 && saldo > 0;
    return {...c, dias, cobrado, saldo, vencido};
  });

  if (filtroCob === 'pendiente') lista = lista.filter(c => c.saldo > 0 && !c.vencido);
  if (filtroCob === 'pagado') lista = lista.filter(c => c.saldo <= 0);
  if (filtroCob === 'vencido') lista = lista.filter(c => c.vencido);

  // Resumen
  const totalCart = cobros.reduce((s,c) => s + (c.monto || 0), 0);
  const totalCob = cobros.reduce((s,c) => s + (c.pagos||[]).reduce((x,p)=>x+(p.monto||0),0), 0);
  const totalPend = totalCart - totalCob;

  document.getElementById('resumen-cobros').innerHTML = `
    <div class="res-cobro">
      <div class="num">${fmtK(totalCart)}</div>
      <div class="lbl">Cartera</div>
    </div>
    <div class="res-cobro pendiente">
      <div class="num">${fmtK(totalPend)}</div>
      <div class="lbl">Pendiente</div>
    </div>
    <div class="res-cobro cobrado">
      <div class="num">${fmtK(totalCob)}</div>
      <div class="lbl">Cobrado</div>
    </div>
  `;

  if (lista.length === 0) {
    document.getElementById('lista-cobros').innerHTML =
      '<div class="vacio"><div class="icono">💰</div><p>' +
      (fbConectado ? 'Sin registros en esta categoría' : 'Conectando a Firebase…') +
      '</p></div>';
    return;
  }

  const html = lista.map(c => {
    const pct = c.monto > 0 ? Math.min(100, Math.round(c.cobrado / c.monto * 100)) : 0;
    const saldoCls = c.saldo <= 0 ? 'pagado' : c.vencido ? 'pendiente' : 'pendiente';
    return `<div class="cobro-card">
      <div class="cobro-header">
        <div class="cobro-cliente">${c.clienteNombre || c.cliente || '—'}
          ${c.vencido ? '<span class="badge alerta">Vencido</span>' : ''}
        </div>
        <div class="cobro-total ${saldoCls}">${fmt(c.saldo > 0 ? c.saldo : c.monto)}</div>
      </div>
      <div class="cobro-detalle">
        ${c.fecha || ''} · ${c.dias} días · ${c.vehiculo || ''} · Rem: ${c.remision || '—'}
      </div>
      <div class="cobro-detalle">Total: ${fmt(c.monto)} | Cobrado: ${fmt(c.cobrado)}</div>
      <div class="barra-cobro"><div class="barra-cobro-fill" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');

  document.getElementById('lista-cobros').innerHTML = html;
}

function setFiltroCob(f, btn) {
  filtroCob = f;
  document.querySelectorAll('#tab-cobros .filtro-btn').forEach(b => b.classList.remove('activo'));
  btn.classList.add('activo');
  renderCobros();
}

// ===== UTILIDADES =====
function fmt(n) {
  return '$' + Number(n || 0).toLocaleString('es-MX', {minimumFractionDigits:0, maximumFractionDigits:0});
}
function fmtK(n) {
  if (n >= 1000) return '$' + (n/1000).toFixed(1) + 'k';
  return fmt(n);
}
function formatFecha(f) {
  if (!f) return '';
  try {
    const d = new Date(f);
    return d.toLocaleDateString('es-MX', {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
  } catch { return f; }
}
